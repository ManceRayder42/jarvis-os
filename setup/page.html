<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shufi Setup</title>
<script>
/* Theme and language are read before first paint so the page never flashes the wrong one.
   Both fall back quietly when storage is blocked. */
(function () {
  var d = document.documentElement, t = 'dark', l = '';
  try { var s = localStorage.getItem('shufi-setup-theme'); if (s === 'light' || s === 'dark') t = s; else if (matchMedia('(prefers-color-scheme: light)').matches) t = 'light'; } catch (e) {}
  try { var q = new URLSearchParams(location.search).get('lang'); if (q === 'he' || q === 'en') l = q; else l = localStorage.getItem('shufi-setup-lang') || ''; } catch (e) {}
  if (l !== 'he' && l !== 'en') l = /^he\b/i.test(navigator.language || '') ? 'he' : 'en';
  d.dataset.theme = t; d.lang = l; d.dir = l === 'he' ? 'rtl' : 'ltr';
})();
</script>
<style>
/* ---------------------------------------------------------------------------
   One calm screen. Shufi (the felt owl) sits on one side and talks you through
   it; the open step sits beside. The Skills step is a tree: every branch is a
   topic, tapping one lists the skills and tools inside it. Palette is the
   "Tree: Day" one (sky, bark, one orange), in a dark and a light theme.
   The page loads nothing from outside this server (see the CSP in server.mjs),
   so type is the system stack. All spacing and alignment use logical
   properties so Hebrew (right to left) mirrors correctly.
   --------------------------------------------------------------------------- */
:root, :root[data-theme="dark"] {
  --sky-a: #0f1d34; --sky-b: #16294a; --glowsky: rgba(46,78,130,.45);
  --surface: #1d2c46; --sunk: #172640; --lift-hover: #263757;
  --ink: #f2e6d8; --ink-strong: #fff7ea; --ink-soft: #ddd0c0; --ink-muted: #c3b3a1;
  --line: rgba(242,230,216,.16); --line-strong: rgba(242,230,216,.34);
  --orange: #e5813f; --orange-hi: #f09a5d; --orange-ink: #1f0e04;
  --accent-text: #f3b048;
  --ok: #8fd18a; --bad: #ff9b9b; --warn: #f3b048;
  --focus: #fff7ea; --frame: #5d4130;
  --shadow: rgba(0,0,0,.5);
  /* the drawing */
  --wood: #5d4130; --wood-hi: #8d6549; --canopy: #27423b; --canopy-2: #1f352f; --canopy-3: #31504a;
  --leafy: #5b8f6f; --leafy-2: #47775c; --leaf-edge: #2a4a3d;
  --ground: #2c1b13; --ground-2: #3b261b; --sun: #e8d3ac; --moon-cut: #13223d; --stars: .85; --rays: 0;
  --tag: #1d2c46; --tag-ink: #f2e6d8; --tag-dim: #c9b8a4;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --sky-a: #f7f0e4; --sky-b: #efe3cf; --glowsky: rgba(243,176,72,.3);
  --surface: #fbf6ee; --sunk: #f3eadb; --lift-hover: #efe3cf;
  --ink: #321a13; --ink-strong: #24110b; --ink-soft: #4a352b; --ink-muted: #6a5b50;
  --line: rgba(50,26,19,.16); --line-strong: rgba(50,26,19,.4);
  --orange: #e5813f; --orange-hi: #d9702a; --orange-ink: #1f0e04;
  --accent-text: #8f4310;
  --ok: #2f6b2c; --bad: #a32020; --warn: #8f4310;
  --focus: #24110b; --frame: #8a6244;
  --shadow: rgba(50,26,19,.28);
  --wood: #8a6244; --wood-hi: #b58a62; --canopy: #aabf8b; --canopy-2: #93ab76; --canopy-3: #c3d3a6;
  --leafy: #8fb06c; --leafy-2: #7a9c5a; --leaf-edge: #5f7d45;
  --ground: #9db07f; --ground-2: #b3c496; --sun: #f3b048; --moon-cut: transparent; --stars: 0; --rays: 1;
  --tag: #fbf6ee; --tag-ink: #321a13; --tag-dim: #5e4f44;
  color-scheme: light;
}
:root {
  --radius: 16px;
  --display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
  --font: "Helvetica Neue", Helvetica, Arial, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--sky-a);
  color: var(--ink);
  font: 15px/1.55 var(--font);
  -webkit-font-smoothing: antialiased;
}
/* The sky sits behind everything and never moves. */
.sky { position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(60% 50% at 24% 90%, rgba(243,176,72,.1), transparent 70%), radial-gradient(90% 70% at 50% 0%, var(--glowsky), transparent 70%), linear-gradient(var(--sky-a), var(--sky-b)); }
.stars { position: absolute; inset: 0; opacity: var(--stars); }
.star { position: absolute; width: var(--s, .7rem); height: var(--s, .7rem); background: #f6dca5; opacity: .75;
  clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); animation: tw 5s ease-in-out infinite; animation-delay: var(--d, 0s); }
@keyframes tw { 0%, 100% { opacity: .8; } 50% { opacity: .35; } }

a { color: var(--accent-text); text-decoration: underline; text-underline-offset: 3px; }
a:hover { color: var(--ink-strong); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap { position: relative; z-index: 1; max-width: 1360px; margin: 0 auto; padding: 14px 24px 48px; }

/* ---- top bar ------------------------------------------------------------- */
.top { display: flex; align-items: center; gap: 10px; margin-block-end: 14px; min-height: 44px; }
.brand { font: 600 26px/1 var(--display); letter-spacing: .01em; color: var(--ink-strong); }
.top .spacer { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-soft);
  padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px; background: var(--sunk); }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
.pill[data-state="off"] i { background: var(--bad); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 25%, transparent); }
.iconbtn { min-width: 44px; height: 44px; padding: 0 10px; display: inline-grid; place-items: center; border-radius: 12px; border: 1.5px solid var(--line-strong);
  background: var(--surface); color: var(--ink); cursor: pointer; font-weight: 700; font-size: 13px; }
.iconbtn:hover { background: var(--lift-hover); }
.iconbtn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---- layout: Shufi on one side, the open step beside -------------------- */
.shell { display: grid; grid-template-columns: minmax(0, 20rem) minmax(0, 1fr); gap: 22px; align-items: start; }
.side { position: sticky; top: 12px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.main { min-width: 0; }

/* ---- Shufi: a felt owl in an arched window ------------------------------ */
.stage { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; }
.owl { position: relative; width: min(100%, 15.5rem); aspect-ratio: 1 / 1.03; cursor: pointer; -webkit-tap-highlight-color: transparent;
  border: 6px solid var(--frame); border-radius: 999px 999px 14px 14px; overflow: hidden; background: #111f35;
  box-shadow: 0 14px 26px -14px var(--shadow); animation: float 5.5s ease-in-out infinite; padding: 0; display: block; }
.owl .face { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .25s ease-out; }
.owl .face img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .35s ease; }
.owl .face img.on { opacity: 1; }
.owl .face.letter { display: grid; place-items: center; color: var(--orange); font: 700 64px var(--display); }
.owl[data-mood="working"] { outline: 3px dashed var(--orange); outline-offset: 3px; }
.owl[data-mood="happy"] { box-shadow: 0 0 0 4px color-mix(in srgb, var(--orange) 55%, transparent), 0 14px 26px -14px var(--shadow); }
.owl.hop { animation: hop .55s cubic-bezier(.3,1.6,.5,1); }
@keyframes float { 50% { translate: 0 -5px; } }
@keyframes hop { 40% { translate: 0 -14px; scale: 1.03; } }

.bubble { position: relative; width: 100%; padding: 13px 18px; border-radius: 16px; background: var(--surface); border: 1.5px solid var(--line-strong); text-align: start; }
.bubble::before { content: ""; position: absolute; inset-inline-start: 2.4rem; top: -8px; width: 14px; height: 14px; rotate: 45deg;
  background: var(--surface); border-inline-start: 1.5px solid var(--line-strong); border-block-start: 1.5px solid var(--line-strong); }
.hello { margin: 0 0 3px; font-size: 11.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-muted); }
.say { margin: 0; color: var(--ink-strong); font: 500 19px/1.3 var(--display); min-height: 1.3em; }
.say.pop { animation: pop .3s ease-out; }
@keyframes pop { from { opacity: 0; translate: 0 4px; } }

/* ---- stepper ------------------------------------------------------------- */
.stepper { margin: 0 0 14px; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; gap: 4px; }
.steps li { flex: 1 1 0; min-width: 0; }
.step { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center; min-height: 44px;
  padding: 8px 4px; border: 1.5px solid transparent; border-radius: 12px; background: transparent; cursor: pointer; position: relative; }
.step:hover { background: color-mix(in srgb, var(--surface) 70%, transparent); }
.step[aria-current="step"] { background: var(--surface); border-color: var(--line-strong); }
.num { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700;
  border: 2px dashed var(--line-strong); color: var(--ink-soft); background: transparent; }
.step[aria-current="step"] .num { border: 2px solid var(--orange); color: var(--ink-strong); }
.step[data-state="ok"] .num { background: var(--orange); border: 2px solid var(--orange); color: var(--orange-ink); }
.step[data-state="warn"] .num { border: 2px solid var(--warn); color: var(--warn); }
.step .stxt { display: block; min-width: 0; max-width: 100%; }
.step .t { display: block; font-weight: 600; color: var(--ink-strong); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.step .s { display: block; font-size: 11.5px; color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.step .opt { display: none; }
.progress { margin: 8px auto 0; max-width: 420px; display: flex; align-items: center; gap: 12px; color: var(--ink-soft); font-size: 12.5px; }
.progress span { white-space: nowrap; }
.bar { flex: 1; height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar b { display: block; height: 100%; width: 0; background: var(--orange); border-radius: 99px; transition: width .6s ease; }

.card { border: 1.5px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); padding: 28px; min-height: 360px; box-shadow: 0 16px 30px -22px var(--shadow); }
.card.tree { padding: 18px 20px 20px; min-height: 0; }
.card h2:focus { outline: none; }
.card h2 { margin: 0 0 6px; font: 600 26px/1.15 var(--display); color: var(--ink-strong); }
.card .lead { margin: 0 0 22px; color: var(--ink-soft); max-width: 640px; }
.section-label { margin: 26px 0 10px; font-size: 11.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-muted); }

/* ---- rows ---------------------------------------------------------------- */
.list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.row { display: flex; align-items: center; gap: 14px; padding: 13px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--sunk); }
.row .grow { flex: 1; min-width: 0; }
.row .name { font-weight: 600; color: var(--ink-strong); }
.row .meta { font-size: 13px; color: var(--ink-soft); overflow-wrap: anywhere; }
.row .grow .cmd + .cmd { margin-block-start: 6px; }
.branch { position: relative; margin-block: 14px 0; margin-inline: 18px 0; padding-inline-start: 18px; border-inline-start: 2px solid var(--line-strong); }
.branch .section-label { margin: 0 0 8px; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--line-strong); }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }

.chip { font-size: 12px; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--line-strong); color: var(--ink-soft); white-space: nowrap; }
.chip.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 55%, transparent); }
.chip.warn { color: var(--ink-strong); border-color: var(--line-strong); }
.chip.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 55%, transparent); }

/* ---- tool cards ---------------------------------------------------------- */
.tools { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(250px, 100%), 1fr)); gap: 12px; }
.callout + .tools { margin-block-start: 14px; }
.tool { display: flex; flex-direction: column; gap: 10px; padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--sunk); }
.tool[data-state="ready"] { border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
.tool header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tool .name { font-weight: 600; color: var(--ink-strong); }
.tool .why { font-size: 13.5px; color: var(--ink-soft); flex: 1; }
.tool .after { font-size: 12.5px; color: var(--ink-muted); }
.tool .kind { font-size: 11px; color: var(--ink-muted); font-family: var(--mono); }
.tool .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* ---- controls ------------------------------------------------------------ */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1.5px solid var(--orange); border-radius: 12px; cursor: pointer; min-height: 44px;
  padding: 10px 18px; font-weight: 700; font-size: 14.5px; background: var(--orange); color: var(--orange-ink); transition: filter .15s, transform .05s; }
.btn:hover:not([disabled]) { filter: brightness(1.07); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .6; cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-strong); }
.btn.ghost:hover:not([disabled]) { background: var(--lift-hover); filter: none; }
.btn.sm { padding: 6px 12px; font-size: 13px; border-radius: 10px; min-height: 36px; }
.btn.big { padding: 14px 24px; font-size: 16px; }
.nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-block-start: 22px; padding-block-start: 16px; border-block-start: 1px solid var(--line); }

input[type=text], input[type=password] { width: 100%; min-height: 44px; padding: 10px 13px; border-radius: 10px; border: 1.5px solid var(--line-strong);
  background: var(--sunk); color: var(--ink-strong); font: 14px var(--mono); direction: ltr; text-align: start; }
input::placeholder { color: var(--ink-muted); opacity: .8; }
.field { display: grid; gap: 6px; margin-block-end: 14px; }
.field label { font-size: 13px; color: var(--ink-soft); font-weight: 600; }
.inline { display: flex; gap: 8px; align-items: center; }

.switch { position: relative; width: 44px; height: 26px; flex: none; }
.switch input { opacity: 0; width: 100%; height: 100%; position: absolute; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 99px; background: var(--line-strong); transition: background .15s; }
.switch span::after { content: ""; position: absolute; inset-inline-start: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: inset-inline-start .15s; box-shadow: 0 1px 3px rgba(0,0,0,.35); }
.switch input:checked + span { background: var(--orange); }
.switch input:checked + span::after { inset-inline-start: 21px; }
.switch input:disabled { cursor: default; } .switch input:disabled + span { opacity: .45; }
.switch input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 3px; }

.cmd { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 12px; border-radius: 10px; border: 1.5px dashed var(--line-strong);
  background: var(--sunk); font: 12.5px var(--mono); color: var(--ink-soft); direction: ltr; text-align: left; }
.cmd code { min-width: 0; flex: 1; overflow-x: auto; white-space: nowrap; }
.note { font-size: 13px; color: var(--ink-soft); margin: 10px 0 0; }
.callout { padding: 14px 16px; border-radius: 12px; border: 1.5px solid var(--line-strong); background: var(--sunk); color: var(--ink-soft); font-size: 14px; }
.callout b { color: var(--ink-strong); }
.msg { font-size: 13px; margin-block-start: 6px; }
.msg.bad { color: var(--bad); } .msg.ok { color: var(--ok); }
details { border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin-block-start: 14px; background: var(--sunk); }
summary { cursor: pointer; color: var(--ink-soft); font-size: 13.5px; }
.done-list { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.done-list li { display: flex; gap: 12px; align-items: flex-start; }
.done-list .k { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--sunk); color: var(--ink-strong); font-weight: 600; font-size: 13px; }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid color-mix(in srgb, currentColor 30%, transparent); border-top-color: currentColor; animation: r .8s linear infinite; flex: none; }
@keyframes r { to { transform: rotate(360deg); } }

/* ================= the tree (Skills step) ================= */
.treehead { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-block-end: 4px; }
.treehead h2 { margin: 0; }
.treehead p { margin: 0; color: var(--ink-soft); font-size: 14px; }
#scenewrap { position: relative; width: 100%; height: clamp(22rem, calc(100vh - 21rem), 49rem); overflow: hidden; }
#scene { position: absolute; inset-inline-start: 0; left: 0; top: 0; width: 950.4px; height: 780px; transform-origin: 0 0; direction: ltr; }
#scene > * { position: absolute; }
.layer { left: 0; top: 0; overflow: visible; pointer-events: none; }
#back { width: 950.4px; height: 780px; }
#items { left: 0; top: 0; width: 950.4px; height: 780px; pointer-events: none; }
#items > * { pointer-events: auto; }
.sunc { fill: var(--sun); } .sunr { fill: none; stroke: var(--ink); stroke-opacity: .3; stroke-width: 2; stroke-dasharray: 6 6; }
.suncut { fill: var(--moon-cut); }
.rays { fill: none; stroke: var(--sun); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 1 12; opacity: var(--rays); }
#ground path.g1 { fill: var(--ground); } #ground path.g2 { fill: var(--ground-2); }
.wood { fill: none; stroke: var(--wood); stroke-linecap: round; stroke-linejoin: round; }
.woodhi { fill: none; stroke: var(--wood-hi); stroke-linecap: round; opacity: .6; }
.woodst { fill: none; stroke: var(--accent-text); stroke-width: 1.6; stroke-dasharray: 3 8; opacity: .45; stroke-linecap: round; }
.bg { opacity: 0; } .bg.on { opacity: 1; }
.limb { fill: url(#bark); } .limbhi { fill: var(--wood-hi); opacity: .38; }
.sprigs { opacity: 0; transition: opacity .7s; } .sprigs.on { opacity: 1; transition-delay: var(--sd, .9s); }
.tl { fill: var(--leafy); stroke: var(--leaf-edge); stroke-width: .9; } .tl.b { fill: var(--leafy-2); }
.tuft, .sprig { transform-box: view-box; animation: sprig 8s ease-in-out infinite; animation-delay: var(--td, 0s); }
@keyframes sprig { 0%, 100% { transform: rotate(-1.4deg); } 50% { transform: rotate(1.4deg); } }
.bg .draw { stroke-dasharray: 1; stroke-dashoffset: 0; }
.bg.on .draw { animation: grow var(--dur, 1.2s) cubic-bezier(.45,.1,.3,1) var(--del, 0s) backwards; }
@keyframes grow { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
.grown .bg.on .draw { animation: none; }
#canopy { opacity: 0; transform-box: fill-box; transform-origin: 50% 90%; transform: scale(.35); transition: opacity .8s, transform 1.1s cubic-bezier(.2,.8,.2,1); }
#canopy.show { opacity: 1; transform: none; }
.cano { fill: var(--canopy); } .cano.b { fill: var(--canopy-2); } .cano.c { fill: var(--canopy-3); }

/* topic tags: felt cards hung at the end of each branch */
.btag { position: absolute; display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 3px 7px; width: 138px; padding: 8px 10px 9px; scale: var(--tk, 1); border-radius: 13px; border: 0; cursor: pointer; text-align: start;
  background: var(--orange); color: var(--orange-ink); box-shadow: 0 0 0 3px color-mix(in srgb, var(--orange) 30%, transparent), 0 8px 12px -8px var(--shadow);
  transition: opacity .55s, transform .6s cubic-bezier(.2,.9,.3,1.3); }
.btag::after { content: ""; position: absolute; inset: 4px; border-radius: 9px; border: 1.5px dashed currentColor; opacity: .4; pointer-events: none; }
.btag:hover { transform: translateY(-2px) rotate(-.6deg); }
.btag.seen { background: var(--tag); color: var(--tag-ink); box-shadow: 0 0 0 1.5px var(--line-strong), 0 8px 12px -8px var(--shadow); }
.btag.seen small { color: var(--tag-dim); }
.btag:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; border-radius: 13px; }
.btag .coin { display: block; width: 26px; height: 26px; border-radius: 50%; overflow: hidden; background: #111f35; border: 2px solid #fff7e8; position: relative; }
.btag .coin img { position: absolute; left: -30%; top: -8%; width: 160%; height: 160%; object-fit: cover; }
.btag b { display: block; font: 600 15.5px/1.1 var(--display); }
.btag small { grid-column: 1 / -1; display: block; font-size: 12px; line-height: 1.2; white-space: nowrap; }
.btag.subt { width: 116px; padding: 6px 9px 7px 10px; }
.btag.subt b, .btag.subt small { grid-column: 1 / -1; }
.btag.subt b { font-size: 14px; }
.btag.hid { opacity: 0; transform: scale(.5); pointer-events: none; }

/* ---- state --------------------------------------------------------------- */
const state = { cfg: null, profile: null, preflight: [], skills: [], tools: [], telegram: null, current: null, setupResult: null };

const DEFAULT_PROFILE = {
  product: 'Shufi', title: 'Set up Shufi', subtitle: 'Memory that follows you into every Claude Code session.',
  steps: ['machine', 'memory', 'skills', 'tools', 'phone', 'finish'],
  finish: { headline: "You're set.", lines: ['Open Claude Code in any folder — it already knows you.', 'Say "done" when you finish working, so it remembers.'] },
};

async function refresh(parts = ['cfg', 'preflight', 'skills', 'tools', 'telegram']) {
  const jobs = {
    cfg: async () => { state.cfg = await api('/api/state'); state.profile = { ...DEFAULT_PROFILE, ...((state.cfg && state.cfg.profile) || {}) }; },
    preflight: async () => { state.preflight = (await api('/api/preflight')).checks || []; },
    skills: async () => { state.skills = (await api('/api/skills')).skills || []; },
    tools: async () => { state.tools = (await api('/api/tools')).tools || []; },
    telegram: async () => { state.telegram = await api('/api/telegram-status'); },
  };
  await Promise.all(parts.map((p) => jobs[p]().catch(() => {})));
  if (!state.profile) state.profile = DEFAULT_PROFILE;
}

/* ---- steps --------------------------------------------------------------- */
const STEP_DEFS = {
  machine: { title: 'Your computer', optional: false },
  memory:  { title: 'Memory', optional: false },
  skills:  { title: 'Skills', optional: false },
  tools:   { title: 'Tools', optional: false },
  workspace: { title: 'Team workspace', optional: false },
  phone:   { title: 'Phone & voice', optional: true },
  finish:  { title: 'Start using it', optional: false },
};
function stepTitle(id, english) {
  const p = state.profile || {};
  return (p.step_titles && p.step_titles[id]) || (LANG === 'he' && !english && I18N.he['s_' + id]) || (STEP_DEFS[id] && STEP_DEFS[id].title) || id;
}
function stepList() { return ((state.profile && state.profile.steps) || DEFAULT_PROFILE.steps).filter((id) => STEP_DEFS[id]); }

function teamTools() { return state.tools.filter((t) => t.category === 'workspace'); }
function generalTools() { return state.tools.filter((t) => t.category !== 'workspace'); }

/* One honest status per step: ok / warn / idle, plus a short line. */
function stepStatus(id) {
  const pf = state.preflight;
  switch (id) {
    case 'machine': {
      const bad = pf.filter((c) => c.required && !c.ok).length;
      const ok = pf.filter((c) => c.ok).length;
      if (!pf.length) return { s: 'idle', line: 'Checking…' };
      return bad ? { s: 'warn', line: bad + ' thing to fix' } : { s: 'ok', line: ok + ' of ' + pf.length + ' ready' };
    }
    case 'memory': {
      const made = hubReady();
      return made ? { s: 'ok', line: shortPath(state.cfg.hub) } : { s: 'idle', line: 'Not created yet' };
    }
    case 'skills': {
      const own = state.skills.filter((s) => !s.install);
      const on = own.filter((s) => s.enabled).length;
      return on ? { s: 'ok', line: on + ' of ' + own.length + ' on' } : { s: 'idle', line: 'None on yet' };
    }
    case 'tools': {
      const list = generalTools();
      const ready = list.filter((t) => t.state === 'ready').length;
      if (!list.length) return { s: 'idle', line: '—' };
      return { s: ready === list.length ? 'ok' : (ready ? 'warn' : 'idle'), line: ready + ' of ' + list.length + ' connected' };
    }
    case 'workspace': {
      const list = teamTools();
      const ready = list.filter((t) => t.state === 'ready').length;
      if (!list.length) return { s: 'idle', line: '—' };
      return { s: ready === list.length ? 'ok' : (ready ? 'warn' : 'idle'), line: ready + ' of ' + list.length + ' ready' };
    }
    case 'phone': {
      const tg = state.telegram && state.telegram.configured;
      const v = state.skills.find((s) => s.id === 'voice');
      const n = (tg ? 1 : 0) + (v && v.enabled ? 1 : 0);
      return n ? { s: 'ok', line: [tg && 'Telegram', v && v.enabled && 'voice'].filter(Boolean).join(' + ') } : { s: 'idle', line: 'Optional' };
    }
    case 'finish': {
      const core = stepList().filter((x) => x !== 'finish' && !STEP_DEFS[x].optional);
      const allOk = core.every((x) => stepStatus(x).s === 'ok');
      return allOk ? { s: 'ok', line: 'Ready' } : { s: 'idle', line: 'What to do next' };
    }
  }
  return { s: 'idle', line: '' };
}
function hubReady() {
  if (state.setupResult) return true;
  return Boolean(state.cfg && state.cfg.hub_exists);
}
function shortPath(p) { return String(p || '').replace(/^\/(Users|home)\/[^/]+/, '~'); }


/* Shufi is a needle-felted owl. His poses are webp files served by this
   server (setup/assets/shufi/), behind the same token as the API. */
const POSES = ['idle', 'working', 'happy', 'cheer', 'celebrate', 'point', 'brush', 'camera', 'key', 'worried'];
const poseUrl = (name) => '/assets/shufi/' + name + '.webp?t=' + encodeURIComponent(TOKEN);
const isOwlEdition = (p) => /^(Jarvis OS|Shufi)$/.test((p && p.product) || 'Shufi');

function paintChrome() {
  const p = state.profile;
  document.title = p.title || 'Setup';
  $('#brand').textContent = p.product || 'Shufi';
  /* The felt owl for this edition; another edition (a team profile) gets its
     initial in the same frame, so the page never shows a stranger's face. */
  const face = $('#face');
  const owlEd = isOwlEdition(p);
  if (!face.firstChild) {
    if (owlEd) face.append(...POSES.map((k) => { const i = el('img', { src: poseUrl(k), alt: '', decoding: 'async' }); i.dataset.pose = k; if (k === ($('#owl').dataset.mood || 'idle')) i.classList.add('on'); return i; }));
    else { face.classList.add('letter'); face.textContent = p.product.trim().charAt(0).toUpperCase(); }
  }
  $('#hello').textContent = owlEd ? tr('hello') : (p.product || '');
  $('#title').textContent = p.title;
  $('#subtitle').textContent = p.subtitle;
  $('#owl').setAttribute('aria-label', (p.product || 'Shufi'));

  const ol = $('#steps');
  ol.replaceChildren();
  const ids = stepList();
  ids.forEach((id, i) => {
    const st = stepStatus(id);
    const b = el('button', { className: 'step', type: 'button' });
    b.dataset.state = st.s;
    if (state.current === id) b.setAttribute('aria-current', 'step');
    b.append(...[
      el('span', { className: 'num', textContent: st.s === 'ok' ? '✓' : String(i + 1) }),
      el('span', { className: 'stxt' }, el('span', { className: 't', textContent: stepTitle(id) }), el('span', { className: 's', dir: 'auto', textContent: st.line })),
      STEP_DEFS[id].optional ? el('span', { className: 'opt', textContent: tr('optional') }) : null,
    ].filter(Boolean));
    b.title = stepTitle(id) + (STEP_DEFS[id].optional ? ' (' + tr('optional') + ')' : '') + ' — ' + st.line;
    b.addEventListener('click', () => go(id));
    ol.append(el('li', {}, b));
  });

  const core = ids.filter((x) => x !== 'finish' && !STEP_DEFS[x].optional);
  const done = core.filter((x) => stepStatus(x).s === 'ok').length;
  $('#bar').style.width = Math.round((done / Math.max(1, core.length)) * 100) + '%';
  $('#progress-text').textContent = done === core.length ? tr('progDone') : tr('progSome', done, core.length);
}

function go(id) {
  const was = state.current === id ? lastStatus[id] : null;
  state.current = id;
  if (id !== 'skills') closeTopic(false);
  paintChrome();
  owlReact(id, was);
  const card = $('#card');
  /* The Skills step (the tree) is translated; the other views are English, so
     in a Hebrew page they stay left to right instead of half-mirroring. */
  const translated = id === 'skills';
  card.className = 'card' + (translated ? ' tree' : '');
  if (translated || LANG === 'en') { card.removeAttribute('dir'); card.removeAttribute('lang'); } else { card.dir = 'ltr'; card.lang = 'en'; }
  card.replaceChildren(...[].concat(VIEWS[id]()).filter(Boolean));
  card.append(navRow(id, translated));
  const h = card.querySelector('h2'); if (h) { h.tabIndex = -1; h.focus({ preventScroll: true }); }
  if (window.innerWidth < 960) card.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
}
function navRow(id, translated) {
  const ids = stepList();
  const i = ids.indexOf(id);
  const t = translated ? tr : trEn;
  const nav = el('div', { className: 'nav' });
  const back = el('button', { className: 'btn ghost', type: 'button', textContent: t('back') });
  back.disabled = i === 0;
  back.addEventListener('click', () => go(ids[i - 1]));
  nav.append(back);
  if (i < ids.length - 1) {
    const next = el('button', { className: 'btn', type: 'button', textContent: t('next', stepTitle(ids[i + 1], !translated)) });
    next.addEventListener('click', () => go(ids[i + 1]));
    nav.append(next);
  }
  return nav;
}
async function rerender(parts) { await refresh(parts); go(state.current); }

/* ---- small builders ------------------------------------------------------ */
function head(title, lead) { return [el('h2', { textContent: title }), el('p', { className: 'lead', textContent: lead })]; }
function row(dotCls, name, meta, ...extra) {
  return el('div', { className: 'row' }, el('span', { className: 'dot ' + dotCls }),
    el('div', { className: 'grow' }, el('div', { className: 'name', textContent: name }), meta ? el('div', { className: 'meta', textContent: meta }) : null), ...extra.filter(Boolean));
}
function copyCmd(command) {
  const b = el('button', { className: 'btn ghost sm', type: 'button', textContent: 'Copy' });
  b.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(command); b.textContent = 'Copied'; } catch { b.textContent = 'Select it'; }
    setTimeout(() => { b.textContent = 'Copy'; }, 1500);
  });
  return el('div', { className: 'cmd' }, el('code', { textContent: command }), b);
}
function busy(btn, label) {
  mood('working', 'On it — ' + label.toLowerCase() + '…');
  const old = btn.textContent;
  btn.disabled = true;
  btn.replaceChildren(el('span', { className: 'spin' }), document.createTextNode(label));
  return () => { btn.disabled = false; btn.textContent = old; owlReact(state.current, null); };
}
function sw(checked, disabled, onChange, label) {
  const input = el('input', { type: 'checkbox', checked: !!checked, disabled: !!disabled });
  if (label) input.setAttribute('aria-label', label);
  input.addEventListener('change', () => onChange(input));
  return el('label', { className: 'switch' }, input, el('span'));
}
function secretField(name, label, help) {
  const input = el('input', { type: 'password', placeholder: 'Paste it here', autocomplete: 'off' });
  const b = el('button', { className: 'btn sm', type: 'button', textContent: 'Save' });
  const msg = el('div', { className: 'msg' });
  b.addEventListener('click', async () => {
    const value = input.value.trim(); if (!value) return;
    const done = busy(b, 'Saving');
    try { await post('/api/secret', { name, value }); input.value = ''; msg.className = 'msg ok'; msg.textContent = 'Saved on this computer.'; }
    catch (e) { msg.className = 'msg bad'; msg.textContent = e.message; }
    done();
  });
  return el('div', { className: 'field' }, el('label', { textContent: label || name }), el('div', { className: 'inline' }, input, b), help ? el('div', { className: 'note', textContent: help }) : null, msg);
}

const FRIENDLY = {
  node: 'Node.js — what Claude Code runs on', claude: 'Claude Code', git: 'git — keeps a history of your memory (optional)',
  'git-identity': 'A name for saved changes (optional)', bun: 'Bun — only for the Telegram bridge', tmux: 'tmux — only for always-on mode',
  ffmpeg: 'ffmpeg — only for voice', obsidian: 'Obsidian — read your memory as notes',
};
const INSTALLABLE = ['bun', 'tmux', 'ffmpeg', 'obsidian'];

/* ---- views --------------------------------------------------------------- */

const VIEWS = {
  machine() {
    const pf = state.preflight;
    const bad = pf.filter((c) => c.required && !c.ok);
    const opt = pf.filter((c) => !c.required && !c.ok);
    const out = head('Your computer', 'What Claude Code needs to run this, and anything missing. Required items come first.');
    out.push(bad.length
      ? el('div', { className: 'callout warn' }, el('b', { textContent: bad.length + ' required item needs attention. ' }), document.createTextNode('Fix it below, then press Check again.'))
      : el('div', { className: 'callout' }, el('b', { textContent: 'Everything required is here. ' }), document.createTextNode(opt.length ? opt.length + ' optional extra(s) are missing — fine to skip.' : 'Nothing missing.')));
    const list = el('div', { className: 'list', style: 'margin-top:16px' });
    bad.concat(opt, pf.filter((c) => c.ok)).forEach((c) => {
      const dot = c.ok ? 'ok' : (c.required ? 'bad' : 'warn');
      const extra = [];
      if (!c.ok && INSTALLABLE.includes(c.id)) extra.push(installLegacy(c.id));
      else extra.push(el('span', { className: 'chip ' + dot, textContent: c.ok ? 'Ready' : (c.required ? 'Required' : 'Optional') }));
      list.append(row(dot, FRIENDLY[c.id] || c.label, c.detail || '', ...extra));

    });

    const again = el('button', { className: 'btn ghost sm', type: 'button', textContent: 'Check again', style: 'margin-top:14px' });

      done(); go('machine');
    });
    out.push(again);
    return out;
  },

  memory() {
    const out = head('Memory', 'One folder of plain text files that Claude reads at the start of every session — in any project. This is your second brain.');
    const hubIn = el('input', { type: 'text', value: shortPath((state.cfg && state.cfg.hub) || '~/jarvis-hub'), id: 'hub-path' });
    out.push(el('div', { className: 'field' }, el('label', { htmlFor: 'hub-path', textContent: 'Where to keep it' }), hubIn,
      el('div', { className: 'note', textContent: 'The default is fine. You can open this folder in Obsidian later.' })));

    const go1 = el('button', { className: 'btn big', type: 'button', textContent: hubReady() ? 'Run setup again' : 'Create my memory' });
    const result = el('div', { className: 'list', style: 'margin-top:16px' });
    go1.addEventListener('click', async () => {
      const done = busy(go1, 'Setting up');

        state.setupResult = r;
        await refresh();

        return;
      } catch (e) { result.replaceChildren(row('bad', 'That didn’t work', e.message)); }
      done();
    });
    out.push(el('div', { className: 'inline', style: 'flex-wrap:wrap' }, go1,
      el('span', { className: 'note', style: 'margin:0', textContent: 'Creates the folder, turns on history and the basic skills, and connects the free tools. Safe to run twice.' })));

    if (state.setupResult && state.setupResult.steps) {
      state.setupResult.steps.forEach((st) => {
        result.append(row(st.ok ? 'ok' : 'warn', st.label, st.ok ? (st.detail && st.detail.skipped ? 'Skipped: ' + st.detail.reason : 'Done') : (st.error || 'Needs a look')));
      });
    }
    out.push(result);

    const obs = state.preflight.find((c) => c.id === 'obsidian');

    if (obs && obs.ok) {
      const vIn = el('input', { type: 'text', placeholder: 'Path to your Obsidian vault, e.g. ~/Documents/Notes', value: shortPath((state.cfg && state.cfg.obsidian_vault) || '') });
      const b = el('button', { className: 'btn ghost sm', type: 'button', textContent: 'Link' });
      const msg = el('div', { className: 'msg' });
      b.addEventListener('click', async () => {
        const done = busy(b, 'Linking');
        try {
          const r = await post('/api/config', { obsidian_vault: vIn.value.trim() });
          state.cfg = { ...state.cfg, ...(r.config || {}) };
          const ok = r.vault_link && r.vault_link.linked;
          msg.className = 'msg ' + (ok ? 'ok' : 'bad');
          msg.textContent = ok ? 'Linked — your Shufi memory now shows in your vault as the “Jarvis” folder.' : 'Couldn’t link that folder.';

    } else {
      out.push(row('', 'Obsidian isn’t installed', 'Optional. Install it from the Tools step if you want to browse your memory as notes.'));

  skills() { return skillsView(); },

  tools() {
    const list = generalTools();

    if (!list.length) { out.push(row('warn', 'Couldn’t read the tool list', 'Restart setup with /shufi-setup.')); return out; }
    const ready = list.filter((t) => t.state === 'ready').length;
    out.push(el('div', { className: 'callout' }, el('b', { textContent: ready + ' of ' + list.length + ' ready. ' }), document.createTextNode('Recommended ones are marked — the rest are for when you need them.')));

  workspace() {

  finish() {

/* ---- tools grid ---------------------------------------------------------- */
const KIND = { cli: 'program', app: 'app', mcp: 'connection', repo: 'code' };
function toolGrid(list) {
  const grid = el('div', { className: 'tools' });
  list.forEach((t) => grid.append(toolCard(t)));
  return grid;
}
function toolCard(t) {
  const ready = t.state === 'ready';
  const chip = ready ? el('span', { className: 'chip ok', textContent: t.kind === 'mcp' ? 'Connected' : (t.kind === 'repo' ? 'Downloaded' : 'Installed') })
    : el('span', { className: 'chip' + (t.default ? ' warn' : ''), textContent: t.default ? 'Recommended' : 'Optional' });

function fitScene() {

  TREE.scene.style.transform = `translate(${((w - SW * s) / 2).toFixed(1)}px,${(h - 780 * s).toFixed(1)}px) scale(${s.toFixed(4)})`;

  TREE.mobile.innerHTML = topics.map((t) => mb(t.key, t.items) + (t.key === 'design' ? mb('animation', anim, true) : '')).join('');
  const remaining = items.filter((it) => itemState(it) === 'missing').length;

function coinImg() { return el('span', { className: 'tp-coin' }, el('img', { src: poseUrl('point'), alt: '', decoding: 'async' })); }
function chip(cls, text) { return el('span', { className: 'chip ' + cls, textContent: text }); }
function renderTopic(fresh) {
  if (!TOPIC) return;
  const panel = $('#topic'), { items, anim } = topicList(TOPIC);

    tl.forEach((i) => list.append(topicRow(i, sub)));

function updFoot() {
  const btn = $('#tp-install'); if (!btn || !TOPIC) return;

  const n = items.filter((i) => itemState(i) === 'missing' && MARK.has(i.key)).length;

function topicRow(it, sub) {
  const st = itemState(it), r = it.raw;
  const li = el('li', { className: 'trow' + (sub ? ' sub' : '') }); li.dataset.key = it.key;

  } else first = el('span', { className: 'chk none', 'aria-hidden': 'true', textContent: st === 'installed' ? '✓' : '', style: st === 'installed' ? 'color:var(--ok);font-weight:700' : '' });
  const nameBtn = el('button', { type: 'button', className: 'tname', dir: 'auto', textContent: it.name });
  const more = el('div', { className: 'more' }); more.id = 'more-' + it.key.replace(/[^a-z0-9]/gi, '-');

  let desc = it.desc;

  const msg = el('div', { className: 'msg bad', role: 'alert' });
  /* the small print, behind the name */
  const detail = (it.kind === 'skill' ? r.details : null) || it.desc;
  if (detail && detail !== desc) more.append(el('p', { textContent: detail }));
  else if (st === 'blocked') more.append(el('p', { textContent: it.desc }));
  const url = it.kind === 'skill' ? r.url : r.docs;

/* ---- installing ----------------------------------------------------------- */
async function installOne(it) {
  try {
    if (it.kind === 'skill') {
      const r = await post('/api/skills', { id: it.id, enabled: true });
      it.raw.enabled = Boolean(r && r.enabled);
      return { ok: it.raw.enabled, error: it.raw.enabled ? '' : 'did not turn on' };
    }
    const isMcp = it.raw.kind === 'mcp';
    const r = await post(isMcp ? '/api/tools/connect' : '/api/tools/install', { id: it.id });
    if (r && r.ok) { it.raw.state = 'ready'; return { ok: true }; }
    return { ok: false, error: (r && (r.error || r.detail)) || 'did not work', manual: r && r.manual };
  } catch (e) { return { ok: false, error: e.message }; }
}
async function installMany(list, base, total, say) {
  const res = { ok: [], fail: [] };
  for (let i = 0; i < list.length; i++) {
    say(tr('prog', base + i + 1, total, list[i].name));
    const r = await installOne(list[i]);
    (r.ok ? res.ok : res.fail).push({ it: list[i], error: r.error, manual: r.manual });
  }
  return res;
}
function summary(into, res, scope) {
  const box = el('div', { className: 'callout' });
  const lines = [];
  if (res.ok.length) lines.push(el('div', {}, el('b', { textContent: tr('doneSum', res.ok.length) })));
  if (res.fail.length) {
    const ul = el('ul'); res.fail.forEach((f) => ul.append(el('li', { textContent: f.it.name + ': ' + (f.error || '') })));
    lines.push(el('div', {}, el('b', { textContent: tr('failSum') }), ul));
  }
  const left = (scope || allItems()).map((it) => itemState(it));
  const ext = left.filter((s) => s === 'external').length, key = left.filter((s) => s === 'needskey').length;
  if (ext) lines.push(el('div', { textContent: tr('manualSum', ext) }));
  if (key) lines.push(el('div', { textContent: tr('keySum', key) }));
  if (!lines.length) lines.push(el('div', { textContent: tr('nothingToDo') }));
  box.append(...lines); into.replaceChildren(box);
}
async function afterInstall() {
  await refresh(['skills', 'tools', 'preflight']);
  paintChrome(); paintTree(); renderTopic(false);
}
let installing = false;
async function installMarked(btn) {
  if (installing || !TOPIC) return;
  const { items } = topicList(TOPIC);
  const list = items.filter((i) => itemState(i) === 'missing' && MARK.has(i.key));
  if (!list.length) return;
  installing = true; btn.dataset.busy = '1'; btn.disabled = true; btn.replaceChildren(el('span', { className: 'spin' }), document.createTextNode(tr('installSelBusy')));
  const status = $('#tp-status'); mood('working', tr('working', topicLabel(TOPIC).toLowerCase()));
  const tools = list.filter((i) => i.kind === 'tool'), skills = list.filter((i) => i.kind === 'skill');
  const say = (t) => { status.textContent = t; };
  const a = await installMany(tools, 0, list.length, say);
  if (tools.length) await refresh(['skills', 'tools', 'preflight']);   // a tool can unblock a skill
  const fresh = skills.map((s) => allItems().find((x) => x.key === s.key) || s);
  const b = await installMany(fresh.filter((s) => itemState(s) === 'missing'), tools.length, list.length, say);
  const res = { ok: a.ok.concat(b.ok), fail: a.fail.concat(b.fail) };
  res.ok.forEach((x) => MARK.delete(x.it.key));
  installing = false; delete btn.dataset.busy;
  await afterInstall();
  summary($('#tp-status') || document.createElement('div'), res, TOPIC ? topicList(TOPIC).items : null);
  owlReact(state.current, null);
}
async function installAll() {
  if (installing) return;
  seedMarks();
  const all = TREE.all, log = TREE.log;
  const first = allItems().filter((i) => itemState(i) === 'missing' && i.kind === 'tool');
  const skillCount = allItems().filter((i) => itemState(i) === 'missing' && i.kind === 'skill').length;
  const total = first.length + skillCount;
  if (!total) { summary(log, { ok: [], fail: [] }); return; }
  installing = true; all.dataset.busy = '1'; all.disabled = true; all.setAttribute('aria-busy', 'true');
  all.replaceChildren(el('span', { className: 'spin' }), document.createTextNode(tr('installAllBusy')));
  mood('working', tr('working', tr('installAll')));
  const say = (t) => { log.replaceChildren(el('div', { className: 'callout', textContent: t })); };
  const a = await installMany(first, 0, total, say);
  await refresh(['skills', 'tools', 'preflight']);   // tools first: an installed program unblocks its skills
  const second = allItems().filter((i) => itemState(i) === 'missing' && i.kind === 'skill');
  const b = await installMany(second, first.length, total, say);
  const res = { ok: a.ok.concat(b.ok), fail: a.fail.concat(b.fail) };
  res.ok.forEach((x) => MARK.delete(x.it.key));
  installing = false; delete all.dataset.busy;
  await afterInstall();

  owlReact(state.current, null);
}

/* ---- the owl: what it says, how it looks, how it follows you -----------
   Mood is idle / working (any button busy) / happy (the open step just
   turned green, or everything is done). The owl tilts toward the pointer and
   hops when clicked. Under prefers-reduced-motion it only changes pose. */
/* Each click shows the next pose, with a line that fits it. In order, never
   random, so two clicks in a row never land on the same pose. */
let trick = 0;
const lastStatus = {};
let moodTimer = 0;
function mood(m, line) {
  const owl = $('#owl');
  clearTimeout(moodTimer);
  owl.dataset.mood = m;
  showPose(m);
  if (line != null) speak(line);
}
function showPose(name) {
  document.querySelectorAll('#face img').forEach((i) => i.classList.toggle('on', i.dataset.pose === name));
}
function speak(line) {
  const say = $('#say');
  if (say.textContent === line) return;
  say.textContent = line;
  say.classList.remove('pop'); void say.offsetWidth; say.classList.add('pop');
}
function lineFor(id) {
  if (id === 'finish') {
    const ok = stepStatus('finish').s === 'ok';
    return ok ? tr('finOk') : tr('finOpen');
  }
  const st = stepStatus(id);
  const say = tr('SAY_' + id);
  if (st.s === 'ok') return tr('doneLine', stepTitle(id), say === 'SAY_' + id ? '' : say);
  return say === 'SAY_' + id ? ((state.profile && state.profile.subtitle) || '') : say;
}
function owlReact(id, was) {
  const st = stepStatus(id).s;
  stepList().forEach((x) => { lastStatus[x] = stepStatus(x).s; });
  const justDone = was && was !== 'ok' && st === 'ok';
  if (justDone || (id === 'finish' && st === 'ok')) {
    mood('happy', justDone ? tr('justDone', stepTitle(id)) : lineFor(id));
    hop();
    if (justDone) moodTimer = setTimeout(() => mood('idle', lineFor(id)), 2600);
  } else {
    mood('idle', lineFor(id));
  }
}
function hop() {
  const owl = $('#owl');
  owl.classList.remove('hop'); void owl.offsetWidth; owl.classList.add('hop');
}
(function follow() {
  const owl = $('#owl'), face = $('#face');
  owl.addEventListener('click', () => {
    const m = owl.dataset.mood;
    if (m === 'working') return;
    const tricks = tr('tricks').filter(([k]) => POSES.includes(k));
    hop();
    if (!tricks.length) {
      mood('happy', tr('tricks')[0][1]);
    } else {
      const [pose, line] = tricks[trick++ % tricks.length];
      clearTimeout(moodTimer);
      owl.dataset.mood = 'happy';
      showPose(pose);
      speak(line);
    }
    moodTimer = setTimeout(() => mood('idle', lineFor(state.current)), 2600);
  });
  if (REDUCED.matches) return;
  let raf = 0, tx = 0, ty = 0;
  window.addEventListener('pointermove', (e) => {
    const r = owl.getBoundingClientRect();
    tx = Math.max(-1, Math.min(1, (e.clientX - (r.left + r.width / 2)) / (window.innerWidth / 2)));
    ty = Math.max(-1, Math.min(1, (e.clientY - (r.top + r.height / 2)) / (window.innerHeight / 2)));
    if (!raf) raf = requestAnimationFrame(() => {
      raf = 0;
      face.style.transform = 'rotateY(' + (tx * 8).toFixed(2) + 'deg) rotateX(' + (-ty * 6).toFixed(2) + 'deg) scale(1.04) translate(' + (tx * 4).toFixed(1) + 'px,' + (ty * 3).toFixed(1) + 'px)';
    });
  });
  document.addEventListener('pointerleave', () => { face.style.transform = ''; });
})();

/* ---- boot ---------------------------------------------------------------- */
(async () => {
  await refresh();
  /* Open the first step that still needs something, so the page always
     points at the next useful thing to do. */
  const ids = stepList();
  const first = ids.find((id) => id !== 'finish' && !STEP_DEFS[id].optional && stepStatus(id).s !== 'ok') || 'finish';
  go(first);
})();

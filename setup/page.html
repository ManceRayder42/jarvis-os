<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis OS</title>
<style>
/* ---------------------------------------------------------------------------
   A console that fills the screen, not a card floating in the middle of one.
   Detail lives in two rails at the edges; the middle stays quiet so the core
   reads. Everything is on one screen and the default path is a single press.

   The ground is near-black on purpose. The emblem artwork sits on black and is
   composited with `screen`, so any lighter page colour would draw a visible
   disc around it -- which is exactly what it used to do.
   --------------------------------------------------------------------------- */
:root {
  color-scheme: dark;
  --bg: #02070b;
  --panel: rgba(6, 18, 26, .72);
  --line: #123243;
  --line-soft: rgba(90, 215, 255, .16);
  --ink: #eaf6ff;
  --ink-dim: #8fb0c6;
  --cyan: #5ad7ff;
  --cyan-deep: #1c6f92;
  --amber: #ffa33f;
  --ok: #4fe3a3;
  --warn: #ffc857;
  --bad: #ff7a88;
  --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  color: var(--ink);
  background: var(--bg);
  overflow: hidden;
}

/* ---- backdrop plates ------------------------------------------------------ */
#bgvid, .plate {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  pointer-events: none;
}
.plate { background: center/cover no-repeat; }
#plate-frame { z-index: -4; opacity: .85; }
#bgvid       { z-index: -3; opacity: .85; }
#plate-wash  { z-index: -2; background:
  radial-gradient(76vmin 66vmin at 50% 42%, rgba(2,7,11,.70) 0%, rgba(2,7,11,.34) 56%, rgba(2,7,11,0) 84%); }
@media (prefers-reduced-motion: reduce) { #bgvid { display: none; } }

/* ---- frame ---------------------------------------------------------------- */
.shell { position: relative; height: 100%; display: grid; grid-template-rows: auto 1fr auto; }

.topbar {
  display: flex; align-items: center; gap: 16px;
  padding: 16px 26px;
  font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--ink-dim);
}
.topbar b { color: var(--ink); letter-spacing: .22em; font-weight: 600; }
.topbar .sep { flex: 1; }
.live { display: inline-flex; align-items: center; gap: 7px; color: var(--cyan); }
.live i { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); animation: pulse 2.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }

/* One column. The emblem, what it is, and the single thing to press. */
.main { display: grid; place-items: center; min-height: 0; padding: 0 26px; }
.core-col { display: grid; place-items: center; gap: 30px; }
.stage { position: relative; width: min(44vh, 380px); aspect-ratio: 1; display: grid; place-items: center; }
.rings { position: absolute; inset: -16%; width: 132%; height: 132%; }
.rings g { transform-origin: 50% 50%; }
.r-slow { animation: spin 110s linear infinite; }
.r-mid  { animation: spin 64s linear infinite reverse; }
.r-fast { animation: spin 34s linear infinite; }
.r-tick { animation: spin 170s linear infinite reverse; }
@keyframes spin { to { transform: rotate(360deg); } }
.progress { position: absolute; inset: -16%; width: 132%; height: 132%; pointer-events: none; }
.progress circle { fill: none; stroke-linecap: round; transition: stroke-dashoffset 600ms ease, stroke 300ms ease; }

.core { width: 100%; aspect-ratio: 1; border: 0; padding: 0; background: none; cursor: pointer; display: grid; place-items: center; }
.core::before {
  content: ""; position: absolute; inset: 4%; border-radius: 50%;
  background: radial-gradient(circle, rgba(90,215,255,.20), rgba(90,215,255,0) 68%);
  opacity: 0; transition: opacity 220ms ease; pointer-events: none;
}
.core:hover::before, .core:focus-visible::before { opacity: 1; }
body[data-phase="running"] .core::before { opacity: 1; animation: corepulse 1.8s ease-in-out infinite; }
@keyframes corepulse { 50% { opacity: .45; } }
.core img { width: 100%; mix-blend-mode: screen; position: relative; }
.core:focus-visible { outline: 2px solid var(--cyan); outline-offset: 10px; }

.headline { text-align: center; }
.headline h1 { margin: 0; font-size: clamp(28px, 4vw, 46px); font-weight: 620; letter-spacing: -.03em; }
.headline p { margin: 10px 0 0; color: var(--ink-dim); font-size: 16px; }
.cta { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.status { font-size: 13.5px; color: var(--ink-dim); min-height: 20px; text-align: center; }
.status b { color: var(--ink); font-weight: 560; }

.btn {
  font: inherit; font-size: 15px; font-weight: 560;
  padding: 12px 30px;
  border: 1px solid var(--cyan-deep);
  background: linear-gradient(180deg, rgba(20,66,92,.85), rgba(8,28,42,.85));
  color: var(--ink); cursor: pointer;
  clip-path: polygon(9px 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%, 0 9px);
  transition: border-color 140ms ease, box-shadow 140ms ease, transform 140ms ease;
}
.btn:hover { border-color: var(--cyan); box-shadow: 0 0 26px rgba(90,215,255,.18); transform: translateY(-1px); }
.btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
.btn[disabled] { opacity: .55; cursor: default; transform: none; box-shadow: none; }
.btn.ghost { background: transparent; border-color: var(--line); font-weight: 470; }
.btn.small { font-size: 13px; padding: 8px 16px; }


/* hold-to-start: the ring is the progress bar for your own thumb */
.holdring { position: absolute; inset: -16%; width: 132%; height: 132%; pointer-events: none; }
.holdring circle { fill: none; stroke: var(--cyan); stroke-width: 5; stroke-linecap: round;
  filter: drop-shadow(0 0 8px rgba(90,215,255,.65)); transition: stroke-dashoffset 90ms linear, opacity 240ms ease; }
.holdlabel {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase;
  color: var(--ink-dim); opacity: 0; transition: opacity 200ms ease;
}
.core:hover ~ .holdlabel, .core:focus-visible ~ .holdlabel { opacity: 1; }

/* ---- dock: the six things you can open --------------------------------- */
.dockwrap { padding: 0 26px 30px; display: grid; justify-items: center; gap: 14px; }
.hint {
  font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--cyan); min-height: 15px; opacity: 0; transition: opacity 160ms ease; text-align: center;
}
.hint[data-show="1"] { opacity: 1; }
.dock {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 14px;
  width: 100%;
  max-width: 1000px;
}
.cell {
  position: relative;
  display: grid; justify-items: center; gap: 8px;
  padding: 18px 12px 16px;
  border: 1px solid rgba(90,215,255,.14);
  background: rgba(5, 16, 24, .38);
  backdrop-filter: blur(3px);
  color: var(--ink); font: inherit; text-align: center; cursor: pointer;
  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
}
.cell:hover, .cell:focus-visible {
  border-color: var(--cyan); background: rgba(10, 34, 50, .72);
  transform: translateY(-3px); outline: none;
}
.cell .glyph { font-size: 20px; color: var(--cyan); line-height: 1; }
.cell .name { font-size: 14px; font-weight: 560; }
.cell .sub { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim); }
.cell .dot { position: absolute; top: 10px; right: 12px; width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.cell[data-state="ok"]   .dot { background: var(--ok);   box-shadow: 0 0 9px var(--ok); }
.cell[data-state="warn"] .dot { background: var(--warn); box-shadow: 0 0 9px var(--warn); }
.cell[data-state="bad"]  .dot { background: var(--bad);  box-shadow: 0 0 9px var(--bad); }
.cell[data-state="busy"] .dot { background: var(--cyan); animation: pulse 1s ease-in-out infinite; }

.footline {
  display: flex; gap: 18px; justify-content: center;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim);
  opacity: .7;
}

/* ---- panel (what a "menu" opens into) ------------------------------------- */
.scrim {
  position: fixed; inset: 0; z-index: 40;
  background: rgba(1, 5, 9, .78);
  display: grid; place-items: center; padding: 26px;
  opacity: 0; pointer-events: none; transition: opacity 180ms ease;
}
.scrim[data-open="1"] { opacity: 1; pointer-events: auto; }
.panel {
  position: relative;
  width: min(860px, 94vw);
  max-height: 84vh;
  display: flex; flex-direction: column;
  background: linear-gradient(180deg, rgba(7,22,32,.98), rgba(3,12,18,.98));
  border: 1px solid var(--line);
  clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px);
  transform: translateY(8px);
  transition: transform 180ms ease;
}
.scrim[data-open="1"] .panel { transform: none; }
.panel > header {
  display: flex; align-items: baseline; gap: 14px;
  padding: 15px 22px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(90,215,255,.08), transparent);
}
.panel h2 { margin: 0; font-size: 17px; letter-spacing: .02em; font-weight: 620; }
.panel .sub { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); }
.panel .body { padding: 18px 22px 22px; overflow: auto; }
.panel .closer { margin-left: auto; }

.row {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 13px;
  border: 1px solid var(--line);
  background: rgba(5, 16, 24, .6);
  margin-bottom: 8px;
}
.row .grow { flex: 1; min-width: 0; }
.row .name { font-size: 14.5px; }
.row .meta { font-family: var(--mono); font-size: 11.5px; color: var(--ink-dim); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .mark { width: 18px; text-align: center; }
.mark.ok { color: var(--ok); } .mark.warn { color: var(--warn); } .mark.bad { color: var(--bad); }
.groupname { font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em; color: var(--amber); margin: 16px 0 8px; }

code, .mono { font-family: var(--mono); font-size: 12.5px; }
.cmd { display: flex; align-items: center; gap: 8px; background: #010a10; border: 1px solid var(--line); padding: 8px 10px; margin: 6px 0 10px; }
.cmd code { flex: 1; overflow-x: auto; white-space: nowrap; color: var(--cyan); }
input[type="text"], input[type="password"] {
  font: inherit; font-size: 14px; width: 100%;
  padding: 9px 11px; border: 1px solid var(--line); background: #010a10; color: var(--ink);
}
input:focus-visible { outline: 2px solid var(--cyan); outline-offset: 1px; }
label.sw { display: flex; align-items: center; gap: 11px; cursor: pointer; }
.sw input { width: 38px; height: 21px; appearance: none; border-radius: 999px; background: #0b2333; border: 1px solid var(--line); position: relative; cursor: pointer; flex: none; transition: background 160ms ease; }
.sw input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: var(--ink-dim); transition: transform 160ms ease, background 160ms ease; }
.sw input:checked { background: var(--cyan-deep); border-color: var(--cyan); }
.sw input:checked::after { transform: translateX(17px); background: var(--ink); }
.sw input:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
details { margin: 0 0 10px; }
details summary { cursor: pointer; color: var(--ink-dim); font-size: 12.5px; font-family: var(--mono); letter-spacing: .06em; }
details summary:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
details .body { padding: 8px 0 0; font-size: 13.5px; color: var(--ink-dim); line-height: 1.6; }
a { color: var(--cyan); }
.note { font-size: 13px; color: var(--ink-dim); line-height: 1.55; margin: 8px 0; }
.link-out { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; }

@media (max-width: 1000px) {
  .main { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; overflow: auto; }
  .stage { width: min(60vw, 320px); }
  body { overflow: auto; }
}
@media (prefers-reduced-motion: reduce) {
  .rings g, .core::before, .live i { animation: none !important; }
  * { transition-duration: 1ms !important; }
}
</style>

<script>

/* ---------------------------------------------------------------------------
   The whole page is one screen with six things orbiting the emblem. Pressing
   the emblem runs every install step that does not need a human. Nothing else
   is required; the nodes are there for people who want to look.
   --------------------------------------------------------------------------- */
const TOKEN = new URLSearchParams(location.search).get('t') || '';
const $ = (s) => document.querySelector(s);
const el = (t, p = {}) => Object.assign(document.createElement(t), p);

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { 'content-type': 'application/json', 'x-jarvis-token': TOKEN, ...(opts.headers || {}) },
  });
  const text = await res.text();
  let json = null;
  try { json = text ? JSON.parse(text) : null; } catch { /* server said something that isn't JSON */ }
  if (!res.ok) throw new Error((json && (json.error || json.message)) || text || ('HTTP ' + res.status));
  return json;
}
const post = (p, body) => api(p, { method: 'POST', body: JSON.stringify(body || {}) });

/* The server exits when nothing is holding it open. Losing this loop kills the
   page's own backend, so it starts before anything else and never stops. */
setInterval(() => post('/api/heartbeat').catch(() => {}), 3000);
post('/api/heartbeat').catch(() => {});

/* ---- state --------------------------------------------------------------- */
const state = { cfg: null, preflight: [], skills: [], telegram: null };

/* Six things, split into two rails so the console fills the screen instead of
   hugging its middle. Each carries a live status dot and one real number --
   detail you can read at a glance without opening anything. */
const NODES = [
  { id: 'checkup', side: 'left',  glyph: '\u25ce', name: 'Setup',
    why: 'What Jarvis needs to run, and what your machine is missing.',
    hint: 'See what your machine already has.' },
  { id: 'memory',  side: 'left',  glyph: '\u2756', name: 'Memory',
    why: 'The folder it writes to and reads back at the start of every session.',
    hint: 'Where Jarvis keeps what it remembers.' },
  { id: 'skills',  side: 'left',  glyph: '\u2b21', name: 'Abilities',
    why: 'Pick what Jarvis can do \u2014 research, notes, images, browser checks.',
    hint: 'Turn abilities on and off.' },
  { id: 'notes',   side: 'right', glyph: '\u25c8', name: 'Notes',
    why: 'Read and edit its memory inside Obsidian, next to your own notes.',
    hint: 'Link it to your Obsidian vault.' },
  { id: 'phone',   side: 'right', glyph: '\u2706', name: 'Phone',
    why: 'Message Jarvis from Telegram and get answers away from your desk.',
    hint: 'Reach Jarvis from anywhere.' },
  { id: 'voice',   side: 'right', glyph: '\u25d0', name: 'Voice',
    why: 'Send it a voice note, hear the answer spoken back.',
    hint: 'Talk to it instead of typing.' },
];

function placeNodes() {
  const dock = $('#dock');
  NODES.forEach((n) => {
    const btn = el('button', { className: 'cell', id: 'node-' + n.id, type: 'button' });
    btn.dataset.state = 'idle';
    btn.setAttribute('aria-label', n.name + '. ' + n.why);
    btn.title = n.why;
    btn.append(
      el('span', { className: 'dot' }),
      el('span', { className: 'glyph', textContent: n.glyph }),
      el('span', { className: 'name', textContent: n.name }),
      el('span', { className: 'sub', id: 'sub-' + n.id, textContent: '\u2014' }),
    );
    const show = () => setHint(n.why);
    const hide = () => setHint('');
    btn.addEventListener('mouseenter', show);
    btn.addEventListener('mouseleave', hide);
    btn.addEventListener('focus', show);
    btn.addEventListener('blur', hide);
    btn.addEventListener('click', () => openSheet(n.id));
    dock.append(btn);
  });
}
function setHint(text) {
  const h = $('#hint');
  h.textContent = text;
  h.dataset.show = text ? '1' : '0';
}
function nodeState(id, s) { const n = $('#node-' + id); if (n) n.dataset.state = s; }
function subLine(id, text) { const n = $('#sub-' + id); if (n) n.textContent = text; }
function say(html) { $('#status').innerHTML = html; }

const ARC_LEN = 1602;
function arc(fraction) {
  $('#arc').style.strokeDashoffset = String(ARC_LEN * (1 - Math.max(0, Math.min(1, fraction))));
}
function arcColor(c) { $('#arc').style.stroke = c; }

async function runSetup() {
  document.body.dataset.phase = 'running';
  $('#go').disabled = true;
  arcColor('#5ad7ff');
  arc(0);

  /* One call does the whole install. The arc fills as its steps come back, so
     the wait has a shape instead of being a spinner. */
  const ticker = setInterval(() => {
    const now = Number($('#arc').dataset.p || 0);
    if (now < 0.9) { $('#arc').dataset.p = String(now + 0.02); arc(now + 0.02); }
  }, 260);

  let result = null;
  try {
    result = await post('/api/setup-all');
  } catch (e) {
    clearInterval(ticker);
    arcColor('#ff7a88');
    say('That didn’t work. ' + escapeHtml(e.message));
    $('#go').disabled = false;
    $('#go').textContent = 'Hold to try again';
    document.body.dataset.phase = 'idle';
    return;
  }
  clearInterval(ticker);

  const steps = (result && result.steps) || [];
  steps.forEach((st) => {
    const map = { folder: 'memory', history: 'memory', notes: 'notes', skills: 'skills', checkup: 'checkup' };
    if (map[st.id]) nodeState(map[st.id], st.ok ? 'ok' : 'warn');
  });

  await refreshAll();
  arc(1);

  const failed = steps.filter((st) => !st.ok);
  if (failed.length) {
    arcColor('#ffc857');
    document.body.dataset.phase = 'idle';
    $('#headline').textContent = 'Almost there.';
    $('#tagline').textContent = 'Everything else is done.';
    say(escapeHtml(failed.map((f) => f.label).join(' · ')) + ' — open it below to finish.');
    $('#go').textContent = 'Hold to run it again';
  } else {
    arcColor('#4fe3a3');
    document.body.dataset.phase = 'done';
    $('#headline').textContent = 'Jarvis is ready.';
    $('#tagline').textContent = 'It remembers from your next session on.';
    say('Nothing else needed. Everything below is optional.');
    $('#go').textContent = 'Hold to run it again';
  }
  $('#go').disabled = false;
}

/* ---- reading the machine ------------------------------------------------- */
async function refreshAll() {
  try { state.cfg = await api('/api/state'); } catch {}
  try { state.preflight = (await api('/api/preflight')).checks || []; } catch {}
  try { state.skills = (await api('/api/skills')).skills || []; } catch {}
  try { state.telegram = await api('/api/telegram-status'); } catch { state.telegram = null; }
  paintNodes();
}

function check(id) { return state.preflight.find((c) => c.id === id); }


function paintNodes() {
  const required = state.preflight.filter((c) => c.required);
  const badRequired = required.filter((c) => !c.ok);
  const optionalMissing = state.preflight.filter((c) => !c.required && !c.ok);
  const passed = state.preflight.filter((c) => c.ok).length;
  nodeState('checkup', badRequired.length ? 'bad' : (optionalMissing.length ? 'warn' : 'ok'));
  subLine('checkup', state.preflight.length ? passed + '/' + state.preflight.length + ' ready' : 'checking');

  const hub = state.cfg && state.cfg.hub;
  nodeState('memory', hub ? 'ok' : 'idle');
  subLine('memory', hub ? hub.replace(/^.*\//, '') + '/' : 'not set up');

  const on = state.skills.filter((s) => s.enabled).length;
  nodeState('skills', on ? 'ok' : 'idle');
  subLine('skills', on + ' of ' + state.skills.length + ' on');

  const obs = check('obsidian');
  const linked = state.cfg && state.cfg.obsidian_vault;
  nodeState('notes', obs && obs.ok ? (linked ? 'ok' : 'warn') : 'idle');
  subLine('notes', obs && obs.ok ? (linked ? 'linked' : 'found, not linked') : 'not installed');

  const tg = state.telegram;
  nodeState('phone', tg && tg.configured ? 'ok' : 'idle');
  subLine('phone', tg && tg.configured ? ((tg.allow_count || 0) + ' allowed') : 'off');

  const voice = state.skills.find((s) => s.id === 'voice');
  nodeState('voice', voice && voice.enabled ? 'ok' : 'idle');
  subLine('voice', voice && voice.enabled ? 'on' : 'off');

  const t1 = $('#tb-skills'); if (t1) t1.textContent = on + ' skills on';
  const t2 = $('#tb-checks'); if (t2) t2.textContent = passed + '/' + state.preflight.length + ' checks';
  const t3 = $('#tb-host'); if (t3) t3.textContent = location.host;
}

let lastFocus = null;
function openSheet(id) {
  const build = SHEETS[id];
  if (!build) return;
  lastFocus = document.activeElement;
  const { title, sub, body } = build();
  $('#sheet-title').textContent = title;
  $('#sheet-sub').textContent = sub;
  const host = $('#sheet-body');
  host.replaceChildren(body);
  $('#scrim').dataset.open = '1';
  $('#close').focus();
}
function closeSheet() {
  $('#scrim').dataset.open = '0';
  if (lastFocus) lastFocus.focus();
}
$('#close').addEventListener('click', closeSheet);
$('#scrim').addEventListener('click', (e) => { if (e.target === $('#scrim')) closeSheet(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && $('#scrim').dataset.open === '1') closeSheet();
  if (e.key === 'Tab' && $('#scrim').dataset.open === '1') trapFocus(e);
});
function trapFocus(e) {
  const f = $('#scrim').querySelectorAll('a[href], button:not([disabled]), input, summary, [tabindex]:not([tabindex="-1"])');
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

function escapeHtml(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function frag(...kids) { const f = document.createDocumentFragment(); f.append(...kids); return f; }
function row(mark, name, meta, extra) {
  const r = el('div', { className: 'row' });
  r.append(el('span', { className: 'mark ' + mark.cls, textContent: mark.glyph }));
  const g = el('div', { className: 'grow' });
  g.append(el('div', { className: 'name', textContent: name }));
  if (meta) g.append(el('div', { className: 'meta', textContent: meta }));
  r.append(g);
  if (extra) r.append(extra);
  return r;
}
function copyCmd(command) {
  const wrap = el('div', { className: 'cmd' });
  wrap.append(el('code', { textContent: command }));
  const b = el('button', { className: 'btn ghost small', textContent: 'Copy', type: 'button' });
  b.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(command); b.textContent = 'Copied'; }
    catch { b.textContent = 'Select it'; }
    setTimeout(() => { b.textContent = 'Copy'; }, 1600);
  });
  wrap.append(b);
  return wrap;
}
function details(summaryText, node) {
  const d = el('details');
  d.append(el('summary', { textContent: summaryText }));
  const b = el('div', { className: 'body' });
  b.append(node);
  d.append(b);
  return d;
}
/* Plain names for things a normal person has no reason to know. The real name
   stays in the details line underneath, for whoever wants it. */
const FRIENDLY = {
  node: 'The engine Claude Code runs on',
  git: 'Optional. Keeps a history of changes',
  'git-identity': 'Optional. A name to sign saved changes with',
  claude: 'Claude Code itself',
  bun: 'Needed only for the Telegram bridge',
  tmux: 'Needed only for the always-on setup',
  ffmpeg: 'Needed only for voice',
  obsidian: 'Obsidian, for reading its memory as notes',
};

const SHEETS = {
  checkup() {
    const body = document.createDocumentFragment();
    const bad = state.preflight.filter((c) => c.required && !c.ok);
    const missingOptional = state.preflight.filter((c) => !c.required && !c.ok);
    if (!bad.length) {
      body.append(row({ cls: 'ok', glyph: '✓' }, 'Everything needed is here',
        missingOptional.length ? missingOptional.length + ' optional extra(s) not installed' : 'Nothing missing'));
    }
    for (const c of bad.concat(missingOptional)) {
      const r = row({ cls: c.required ? 'bad' : 'warn', glyph: c.required ? '!' : '\u00b7' },
        FRIENDLY[c.id] || c.label, c.detail || '');
      if (INSTALLABLE.includes(c.id)) r.append(installButton(c.id));
      body.append(r);
      if (c.fix && !INSTALLABLE.includes(c.id)) body.append(copyCmd(c.fix));
    }
    const all = el('div');
    state.preflight.forEach((c) => {
      all.append(row({ cls: c.ok ? 'ok' : (c.required ? 'bad' : 'warn'), glyph: c.ok ? '✓' : (c.required ? '!' : '·') },
        FRIENDLY[c.id] || c.label, (c.label + (c.detail ? ' — ' + c.detail : ''))));
    });
    body.append(details('Show everything it checked', all));
    const again = el('button', { className: 'btn ghost small', textContent: 'Check again', type: 'button' });
    again.addEventListener('click', async () => {
      again.textContent = 'Checking…';
      try { state.preflight = (await api('/api/preflight?refresh=1')).checks || []; } catch {}
      paintNodes(); openSheet('checkup');
    });
    body.append(el('div', { className: 'note' }), again);
    return { title: 'Your setup', sub: bad.length ? 'One thing needs attention.' : 'All set.', body };
  },

  memory() {
    const body = document.createDocumentFragment();
    const hub = (state.cfg && state.cfg.hub) || '';
    body.append(row({ cls: hub ? 'ok' : 'warn', glyph: hub ? '✓' : '·' },
      hub ? 'Its memory lives here' : 'Not set up yet', hub || 'Press “Set it up” on the main screen'));
    body.append(details('Where exactly, and why a history',
      el('div', { textContent: 'A plain folder of text files at ' + (hub || '(not chosen yet)') +
        '. Every session can add to it, and a change history means nothing is ever lost — you can always look back at what it wrote.' })));
    return { title: 'Memory', sub: 'What Jarvis remembers between sessions.', body };
  },

  skills() {
    const body = document.createDocumentFragment();
    const eliRow = el('div', { className: 'row' });
    const eliLabel = el('label', { className: 'sw grow' });
    const eliBox = el('input', { type: 'checkbox', checked: !!(state.cfg && state.cfg.auto_eli5) });
    eliLabel.append(eliBox, el('span', { textContent: 'Explain things with pictures, not walls of text' }));
    eliRow.append(eliLabel);
    eliBox.addEventListener('change', async () => {
      try {
        const r = await post('/api/config', { auto_eli5: eliBox.checked });
        state.cfg = r.config || state.cfg;
      } catch (e) { eliBox.checked = !eliBox.checked; alert(e.message); }
    });
    body.append(eliRow);

    const groups = {};
    state.skills.forEach((s) => { (groups[s.category || 'other'] ||= []).push(s); });
    Object.entries(groups).forEach(([cat, list]) => {
      body.append(el('div', { className: 'note', textContent: cat.toUpperCase() }));
      list.forEach((s) => {
        const r = el('div', { className: 'row' });
        const lab = el('label', { className: 'sw grow' });
        const box = el('input', { type: 'checkbox', checked: !!s.enabled });
        const blocked = s.precondition_met === false;
        box.disabled = blocked;
        const txt = el('div');
        txt.append(el('div', { className: 'name', textContent: s.name }));
        txt.append(el('div', { className: 'meta', textContent: blocked ? (s.requires_tool || 'Needs something not installed') : s.description }));
        lab.append(box, txt);
        r.append(lab);
        if (s.url) {
          const a = el('a', { className: 'link-out', href: s.url, textContent: 'read more', target: '_blank', rel: 'noopener' });
          r.append(a);
        }
        box.addEventListener('change', async () => {
          box.disabled = true;
          try {
            const res = await post('/api/skills', { id: s.id, enabled: box.checked });
            s.enabled = res.enabled;
          } catch (e) {
            box.checked = !box.checked;
            r.append(el('div', { className: 'meta', textContent: e.message }));
          }
          box.disabled = blocked;
          paintNodes();
        });
        body.append(r);
        if (s.details) txt.title = s.details;
        const needs = (s.requires || []).filter(Boolean);
        if (box.checked && needs.length) needs.forEach((k) => body.append(secretField(k)));
      });
    });
    return { title: 'Abilities', sub: 'Turn on what you want. Nothing here is required.', body };
  },

  notes() {
    const body = document.createDocumentFragment();
    const obs = check('obsidian');
    if (obs && obs.ok) {
      body.append(row({ cls: 'ok', glyph: '✓' }, 'Obsidian is installed', obs.detail || ''));
      const input = el('input', { type: 'text', placeholder: 'Drag your vault folder here, or type its path' });
      input.value = (state.cfg && state.cfg.obsidian_vault) || '';
      const b = el('button', { className: 'btn small', textContent: 'Link it', type: 'button' });
      b.addEventListener('click', async () => {
        b.textContent = 'Linking…';
        try {
          const r = await post('/api/config', { obsidian_vault: input.value.trim() });
          state.cfg = r.config || state.cfg;
          b.textContent = (r.vault_link && r.vault_link.linked) ? 'Linked' : 'Couldn’t link';
        } catch (e) { b.textContent = e.message; }
        paintNodes();
      });
      const wrap = el('div', { className: 'row' });
      wrap.append(input, b);
      body.append(wrap);
      body.append(el('div', { className: 'note', textContent: 'This puts a shortcut called “Jarvis” inside your vault, so its memory shows up with your own notes.' }));
    } else {
      body.append(row({ cls: 'warn', glyph: '·' }, 'Obsidian isn’t installed', 'It’s optional — everything works without it'));
      body.append(el('div', { className: 'note' })).append?.(null);
      const a = el('a', { href: 'https://obsidian.md/download', target: '_blank', rel: 'noopener', textContent: 'Download Obsidian (free)' });
      body.append(el('div', { className: 'note' }));
      body.append(a);
      if (obs && obs.fix) body.append(copyCmd(obs.fix));
    }
    return { title: 'Notes', sub: 'Optional. Read Jarvis’s memory as normal notes.', body };
  },

  phone() {
    const body = document.createDocumentFragment();
    const tg = state.telegram;

    body.append(row({ cls: '', glyph: '1' }, 'Make a bot in Telegram',
      'Message BotFather, send /newbot, answer two questions'));
    body.append(el('a', { href: 'https://t.me/BotFather', target: '_blank', rel: 'noopener',
      textContent: 'Open BotFather \u2192' }));
    body.append(copyCmd('/newbot'));

    body.append(row({ cls: tg && tg.configured ? 'ok' : '', glyph: '2' },
      'Paste what Telegram gives you back', 'A long line starting with numbers'));
    const tokWrap = el('div', { className: 'row' });
    const tokIn = el('input', { type: 'password', placeholder: '123456789:AA\u2026' });
    const tokBtn = el('button', { className: 'btn small', textContent: 'Save', type: 'button' });
    const tokMsg = el('div', { className: 'meta' });
    tokBtn.addEventListener('click', async () => {
      tokBtn.disabled = true; tokBtn.textContent = 'Saving\u2026';
      try {
        await post('/api/telegram-token', { value: tokIn.value.trim() });
        tokBtn.textContent = 'Saved'; tokIn.value = ''; tokMsg.textContent = '';
      } catch (e) { tokBtn.textContent = 'Save'; tokMsg.textContent = e.message; }
      tokBtn.disabled = false;
    });
    tokWrap.append(el('div', { className: 'grow' }), tokBtn);
    tokWrap.firstChild.append(tokIn, tokMsg);
    body.append(tokWrap);

    body.append(row({ cls: '', glyph: '3' }, 'Connect the two', 'One click, runs on your computer'));
    const inst = el('button', { className: 'btn small', textContent: 'Connect', type: 'button' });
    inst.addEventListener('click', async () => {
      inst.disabled = true; inst.textContent = 'Working\u2026';
      try { const r = await post('/api/telegram-install'); inst.textContent = r.ok ? 'Connected' : 'Didn\u2019t work'; }
      catch (e) { inst.textContent = e.message; }
      inst.disabled = false;
    });
    body.append(inst);

    body.append(row({ cls: '', glyph: '4' }, 'Say hello to your bot',
      'Send it any message, then press Check'));
    const check4 = el('button', { className: 'btn ghost small', textContent: 'Check', type: 'button' });
    const out = el('div', { className: 'note' });
    check4.addEventListener('click', async () => {
      try {
        const r = await api('/api/telegram-status');
        state.telegram = r;
        out.replaceChildren();
        if (r.pending && r.pending.length) {
          out.append(el('div', { textContent: 'Last step \u2014 paste this into any Claude session:' }));
          r.pending.forEach((pend) => out.append(copyCmd('/telegram:access pair ' + pend.code)));
        } else {
          out.textContent = r.configured ? 'Connected.' : 'Nothing yet \u2014 send your bot a message first.';
        }
      } catch (e) { out.textContent = e.message; }
      paintNodes();
    });
    body.append(check4, out);

    body.append(details('One thing worth knowing',
      el('div', { textContent: 'Telegram lets only one program listen to a bot at a time. If two are listening, one of them stops hearing you \u2014 and the messages it swallows are gone for good. Run this in one place only.' })));
    return { title: 'Phone', sub: 'Optional. Message Jarvis from anywhere.', body };
  },

  voice() {
    const body = document.createDocumentFragment();
    body.append(row({ cls: '', glyph: '·' }, 'Speak to it, hear it answer',
      'Works without a key too, using speech recognition on your own machine.'));
    body.append(secretField('ELEVENLABS_API_KEY', 'Better voices (ElevenLabs). Optional.'));
    body.append(el('div', { className: 'note', textContent: 'Without a key it still understands what you say, using speech recognition that runs on your own machine.' }));
    return { title: 'Voice', sub: 'Optional.', body };
  },
};

/* Tools the server can install through Homebrew on request. Anything else is
   shown as a command to copy -- we never run something the user didn't ask for. */
const INSTALLABLE = ['bun', 'tmux', 'ffmpeg', 'obsidian'];
function installButton(tool) {
  const b = el('button', { className: 'btn small', textContent: 'Install', type: 'button' });
  b.addEventListener('click', async () => {
    b.disabled = true; b.textContent = 'Installing\u2026';
    try {
      const r = await post('/api/install-tool', { tool });
      if (r.ok) { b.textContent = 'Installed'; state.preflight = (await api('/api/preflight?refresh=1')).checks || []; paintNodes(); }
      else if (r.error === 'no-installer') { b.replaceWith(copyCmd(r.manual || 'see ' + (r.url || ''))); return; }
      else { b.textContent = 'Didn\u2019t work'; }
    } catch (e) { b.textContent = e.message; }
    b.disabled = false;
  });
  return b;
}

function secretField(name, label) {
  const wrap = el('div', { className: 'row' });
  const g = el('div', { className: 'grow' });
  g.append(el('div', { className: 'name', textContent: label || name }));
  const input = el('input', { type: 'password', placeholder: 'Paste key' });
  g.append(input);
  wrap.append(g);
  const b = el('button', { className: 'btn small', textContent: 'Save', type: 'button' });
  b.addEventListener('click', async () => {
    const value = input.value.trim();
    if (!value) return;
    b.disabled = true; b.textContent = 'Saving…';
    try { await post('/api/secret', { name, value }); b.textContent = 'Saved'; input.value = ''; }
    catch (e) { b.textContent = 'Failed'; g.append(el('div', { className: 'meta', textContent: e.message })); }
    b.disabled = false;
  });
  wrap.append(b);
  return wrap;
}

/* ---- boot ---------------------------------------------------------------- */
placeNodes();
/* The emblem is a gate, not a button: hold it and the ring fills, let go early
   and it retreats. Borrowed from the ZERO project's draw-a-zero unlock -- the
   interaction is its own reward, and here it doubles as a guard against the
   accidental click that runs a real install. Keyboard and the plain button
   below stay a single, plain activation. */
const HOLD_MS = 900;
let holdRAF = null;
let holdStart = 0;
function holdPaint(fraction) {
  const ring = $('#hold');
  ring.style.opacity = fraction > 0 ? '1' : '0';
  ring.style.strokeDashoffset = String(ARC_LEN * (1 - fraction));
}
function holdStop(fire) {
  if (holdRAF) cancelAnimationFrame(holdRAF);
  holdRAF = null;
  holdPaint(0);
  if (fire) runSetup();
}
function holdBegin(e) {
  if (e && e.button !== undefined && e.button !== 0) return;
  if (document.body.dataset.phase === 'running') return;
  holdStart = performance.now();
  const tick = () => {
    const f = Math.min(1, (performance.now() - holdStart) / HOLD_MS);
    holdPaint(f);
    if (f >= 1) { holdStop(true); return; }
    holdRAF = requestAnimationFrame(tick);
  };
  holdRAF = requestAnimationFrame(tick);
}
$('#core').addEventListener('pointerdown', holdBegin);
$('#core').addEventListener('pointerup', () => holdStop(false));
$('#core').addEventListener('pointerleave', () => holdStop(false));
$('#core').addEventListener('pointercancel', () => holdStop(false));
/* Keyboard activation of a <button> fires click without pointer events. */
$('#core').addEventListener('click', (e) => { if (e.detail === 0) runSetup(); });
$('#go').addEventListener('pointerdown', holdBegin);
$('#go').addEventListener('pointerup', () => holdStop(false));
$('#go').addEventListener('pointerleave', () => holdStop(false));
$('#go').addEventListener('pointercancel', () => holdStop(false));
$('#go').addEventListener('click', (e) => { if (e.detail === 0) runSetup(); });
$('#core').addEventListener('mouseenter', () => setHint('Hold to set everything up'));
$('#core').addEventListener('mouseleave', () => setHint(''));
$('#explain').addEventListener('click', () => {
  /* Not two paragraphs nobody reads. A picture of the actual problem, then
     three facts. Anyone who wants the long version has the README. */
  $('#sheet-title').textContent = 'What this is';
  $('#sheet-sub').textContent = 'memory that survives';
  const b = el('div');

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 620 240');
  svg.setAttribute('width', '100%');
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label',
    'Without it, each session starts empty. With it, every session reads and writes the same memory folder.');
  svg.innerHTML = [
    '<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">',
    '<path d="M0 0 L10 5 L0 10 z" fill="#5ad7ff"/></marker></defs>',
    // ---- without
    '<text x="0" y="14" fill="#8fb0c6" font-family="ui-monospace,monospace" font-size="11" letter-spacing="2">WITHOUT</text>',
    '<g fill="none" stroke="#3a5568" stroke-width="1.5">',
    '<rect x="0" y="30" width="120" height="52"/><rect x="160" y="30" width="120" height="52"/><rect x="320" y="30" width="120" height="52"/>',
    '</g>',
    '<text x="60" y="60" fill="#8fb0c6" font-size="12" text-anchor="middle">session 1</text>',
    '<text x="220" y="60" fill="#8fb0c6" font-size="12" text-anchor="middle">session 2</text>',
    '<text x="380" y="60" fill="#8fb0c6" font-size="12" text-anchor="middle">session 3</text>',
    '<text x="60" y="76" fill="#ff7a88" font-size="10.5" text-anchor="middle">starts empty</text>',
    '<text x="220" y="76" fill="#ff7a88" font-size="10.5" text-anchor="middle">starts empty</text>',
    '<text x="380" y="76" fill="#ff7a88" font-size="10.5" text-anchor="middle">starts empty</text>',
    // ---- with
    '<text x="0" y="126" fill="#8fb0c6" font-family="ui-monospace,monospace" font-size="11" letter-spacing="2">WITH JARVIS OS</text>',
    '<g fill="none" stroke="#5ad7ff" stroke-width="1.5">',
    '<rect x="0" y="142" width="120" height="52"/><rect x="160" y="142" width="120" height="52"/><rect x="320" y="142" width="120" height="52"/>',
    '<rect x="480" y="142" width="130" height="52"/>',
    '</g>',
    '<text x="60" y="172" fill="#eaf6ff" font-size="12" text-anchor="middle">session 1</text>',
    '<text x="220" y="172" fill="#eaf6ff" font-size="12" text-anchor="middle">session 2</text>',
    '<text x="380" y="172" fill="#eaf6ff" font-size="12" text-anchor="middle">session 3</text>',
    '<text x="545" y="166" fill="#5ad7ff" font-size="12" text-anchor="middle">memory</text>',
    '<text x="545" y="182" fill="#8fb0c6" font-size="10.5" text-anchor="middle">a folder of notes</text>',
    '<g stroke="#5ad7ff" stroke-width="1.5" marker-end="url(#ar)" fill="none">',
    '<path d="M120 168 H150"/><path d="M280 168 H310"/><path d="M440 168 H470"/>',
    '</g>',
    '<path d="M545 194 V214 H60 V198" stroke="#5ad7ff" stroke-width="1.5" fill="none" opacity=".6" marker-end="url(#ar)"/>',
    '<text x="300" y="228" fill="#8fb0c6" font-size="10.5" text-anchor="middle">read back at the start of the next one</text>',
  ].join('');
  svg.style.margin = '4px 0 18px';

  const facts = el('div');
  [
    ['It remembers.', 'Every session writes to one folder and reads it back at the start.'],
    ['It follows you.', 'Any project, any directory — not just the one you set it up in.'],
    ['It stays yours.', 'Plain text files on your own machine. No account, no upload, no key.'],
  ].forEach(([h, d]) => {
    const r = el('div', { className: 'row' });
    const g = el('div', { className: 'grow' });
    g.append(el('div', { className: 'name', textContent: h }));
    g.append(el('div', { className: 'meta', textContent: d, style: 'white-space:normal' }));
    r.append(el('span', { className: 'mark ok', textContent: '\u2022' }), g);
    facts.append(r);
  });

  b.append(svg, facts);
  $('#sheet-body').replaceChildren(b);
  $('#scrim').dataset.open = '1';
  $('#close').focus();
});
refreshAll();

</script>
</body>
</html>

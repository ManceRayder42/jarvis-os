<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis Setup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------------------
   One calm screen: a numbered list of steps on the left, the open step on the
   right. Every step says what it is for in one line, shows its live state,
   and offers exactly one obvious next action. Nothing here is decorative
   except the background, which is the ChatGP knowledge-graph field: drifting
   sky-blue dots joined by faint lines.
   --------------------------------------------------------------------------- */
:root {
  --canvas: #0b1224;
  --lift: rgba(19, 32, 61, .78);
  --lift-solid: #13203d;
  --lift-hover: #1a2a4c;
  --ink: #e2e8f0;
  --ink-strong: #f1f5f9;
  --ink-soft: #cbd5e1;
  --ink-muted: #94a3b8;
  --accent: #7dd3fc;
  --accent-hover: #bae6fd;
  --accent-ink: #062033;
  --line: rgba(148, 163, 184, .14);
  --line-strong: rgba(148, 163, 184, .28);
  --ok: #6ee7b7;
  --warn: #fcd34d;
  --bad: #fda4af;
  --radius: 14px;
  --font: "Sora", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: dark;
}
/* The page is dark by design (the dot field only reads on a dark ground), so
   both theme branches resolve to the same tokens. */
@media (prefers-color-scheme: light) { :root:not([data-theme="light"]) { color-scheme: dark; } }
:root[data-theme="dark"] { color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--canvas);
  color: var(--ink);
  font: 15px/1.55 var(--font);
  -webkit-font-smoothing: antialiased;
}
#graph { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.veil { position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(1200px 700px at 30% 10%, rgba(11,18,36,0) 0%, rgba(11,18,36,.55) 70%, rgba(11,18,36,.85) 100%); }

a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); text-decoration: underline; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

.wrap { position: relative; z-index: 1; max-width: 1120px; margin: 0 auto; padding: 22px 24px 64px; }

/* ---- top bar ------------------------------------------------------------- */
.top { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; }
.mark { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
  background: linear-gradient(145deg, #7dd3fc, #38bdf8 60%, #0ea5e9); color: var(--accent-ink); font-weight: 700; font-size: 15px; }
.brand { font-weight: 600; letter-spacing: .01em; color: var(--ink-strong); }
.top .spacer { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-muted);
  padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px; background: rgba(11,18,36,.5); }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px rgba(110,231,183,.15); }
.pill[data-state="off"] i { background: var(--bad); box-shadow: 0 0 0 3px rgba(253,164,175,.15); }

/* ---- hero ---------------------------------------------------------------- */
.hero { margin-bottom: 30px; max-width: 720px; }
.hero h1 { font-size: clamp(28px, 4vw, 40px); line-height: 1.15; margin: 0 0 10px; color: var(--ink-strong); font-weight: 600; letter-spacing: -.01em; }
.hero p { margin: 0; color: var(--ink-soft); font-size: 16px; }
.progress { margin-top: 22px; display: flex; align-items: center; gap: 12px; color: var(--ink-muted); font-size: 13px; }
.bar { flex: 0 1 260px; height: 6px; border-radius: 99px; background: rgba(148,163,184,.16); overflow: hidden; }
.bar b { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .5s ease; }

/* ---- layout -------------------------------------------------------------- */
.grid { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 22px; align-items: start; }
.steps { list-style: none; margin: 0; padding: 8px; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--lift); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); position: sticky; top: 20px; }
.step { width: 100%; display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; align-items: center; text-align: left;
  padding: 11px 12px; border: 0; border-radius: 10px; background: transparent; cursor: pointer; }
.step:hover { background: rgba(148,163,184,.08); }
.step[aria-current="step"] { background: rgba(125,211,252,.12); }
.num { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 600;
  border: 1.5px solid var(--line-strong); color: var(--ink-soft); }
.step[aria-current="step"] .num { border-color: var(--accent); color: var(--accent); }
.step[data-state="ok"] .num { background: var(--ok); border-color: var(--ok); color: #052e1c; }
.step[data-state="warn"] .num { border-color: var(--warn); color: var(--warn); }
.step .t { display: block; font-weight: 500; color: var(--ink-strong); font-size: 14.5px; }
.step .s { display: block; font-size: 12.5px; color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step .opt { font-size: 11px; color: var(--ink-muted); border: 1px solid var(--line); padding: 1px 7px; border-radius: 99px; }

.card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--lift);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 28px; min-height: 420px; }
.card h2 { margin: 0 0 6px; font-size: 22px; font-weight: 600; color: var(--ink-strong); }
.card .lead { margin: 0 0 22px; color: var(--ink-soft); max-width: 640px; }
.section-label { margin: 24px 0 10px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }

/* ---- rows ---------------------------------------------------------------- */
.list { display: grid; gap: 8px; }
.row { display: flex; align-items: center; gap: 14px; padding: 13px 14px; border: 1px solid var(--line); border-radius: 12px;
  background: rgba(11,18,36,.45); }
.row .grow { flex: 1; min-width: 0; }
.row .name { font-weight: 500; color: var(--ink-strong); }
.row .meta { font-size: 13px; color: var(--ink-muted); overflow-wrap: anywhere; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: rgba(148,163,184,.4); }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }

.chip { font-size: 12px; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--ink-muted); white-space: nowrap; }
.chip.ok { color: var(--ok); border-color: rgba(110,231,183,.35); }
.chip.warn { color: var(--warn); border-color: rgba(252,211,77,.35); }
.chip.bad { color: var(--bad); border-color: rgba(253,164,175,.35); }

/* ---- tool cards ---------------------------------------------------------- */
.tools { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(250px, 100%), 1fr)); gap: 12px; }
.callout + .tools { margin-top: 14px; }
.tool { display: flex; flex-direction: column; gap: 10px; padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: rgba(11,18,36,.45); }
.tool[data-state="ready"] { border-color: rgba(110,231,183,.28); }
.tool header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tool .name { font-weight: 600; color: var(--ink-strong); }
.tool .why { font-size: 13.5px; color: var(--ink-soft); flex: 1; }
.tool .after { font-size: 12.5px; color: var(--ink-muted); }
.tool .kind { font-size: 11px; color: var(--ink-muted); font-family: var(--mono); }
.tool .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* ---- controls ------------------------------------------------------------ */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 10px; cursor: pointer;
  padding: 11px 18px; font-weight: 600; font-size: 14.5px; background: var(--accent); color: var(--accent-ink); transition: background .15s, transform .05s; }
.btn:hover { background: var(--accent-hover); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .55; cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line-strong); }
.btn.ghost:hover { background: rgba(148,163,184,.1); }
.btn.sm { padding: 7px 12px; font-size: 13px; border-radius: 9px; }
.btn.big { padding: 14px 24px; font-size: 16px; }
.nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line); }

input[type=text], input[type=password] { width: 100%; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--line-strong);
  background: rgba(11,18,36,.7); color: var(--ink-strong); font: 14px var(--mono); }
input::placeholder { color: #7c8aa0; }
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 13px; color: var(--ink-soft); font-weight: 500; }
.inline { display: flex; gap: 8px; align-items: center; }

.switch { position: relative; width: 40px; height: 23px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch span { position: absolute; inset: 0; border-radius: 99px; background: rgba(148,163,184,.3); transition: background .15s; cursor: pointer; }
.switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 17px; height: 17px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(17px); }
.switch input:disabled + span { opacity: .45; cursor: default; }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

.cmd { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 12px; border-radius: 10px; border: 1px dashed var(--line-strong);
  background: rgba(11,18,36,.7); font: 12.5px var(--mono); color: var(--ink-soft); }
.cmd code { flex: 1; overflow-x: auto; white-space: nowrap; }
.note { font-size: 13px; color: var(--ink-muted); margin: 10px 0 0; }
.callout { padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(125,211,252,.3); background: rgba(125,211,252,.07); color: var(--ink-soft); font-size: 14px; }
.callout b { color: var(--ink-strong); }
.callout.warn { border-color: rgba(252,211,77,.35); background: rgba(252,211,77,.07); }
.msg { font-size: 13px; margin-top: 6px; }
.msg.bad { color: var(--bad); } .msg.ok { color: var(--ok); }
details { border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin-top: 14px; background: rgba(11,18,36,.35); }
summary { cursor: pointer; color: var(--ink-soft); font-size: 13.5px; }
.done-list { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.done-list li { display: flex; gap: 12px; align-items: flex-start; }
.done-list .k { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: rgba(125,211,252,.15); color: var(--accent); font-weight: 600; font-size: 13px; }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(6,32,51,.35); border-top-color: var(--accent-ink); animation: r .8s linear infinite; }
.btn.ghost .spin { border-color: rgba(226,232,240,.25); border-top-color: var(--ink); }
@keyframes r { to { transform: rotate(360deg); } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media (max-width: 860px) {
  .wrap { padding: 16px 16px 48px; }
  .top { margin-bottom: 26px; }
  .grid { grid-template-columns: minmax(0, 1fr); }
  .step .t { white-space: nowrap; }
  .top .pill { font-size: 11.5px; }
  #link-text { display: none; }
  .steps { position: static; display: flex; overflow-x: auto; gap: 4px; padding: 6px; }
  .step { grid-template-columns: 26px auto; padding: 8px 10px; flex: none; }
  .step .s, .step .opt { display: none; }
  .num { width: 26px; height: 26px; }
  .card { padding: 20px 16px; min-height: 0; }
  .row { flex-wrap: wrap; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<canvas id="graph" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>

<div class="wrap">
  <header class="top">
    <div class="mark" aria-hidden="true">J</div>
    <div class="brand" id="brand">Jarvis OS</div>
    <div class="spacer"></div>
    <span class="pill" id="link" data-state="on"><i></i><span id="link-text">Connected to your computer</span></span>
  </header>

  <section class="hero">
    <h1 id="title">Set up Jarvis</h1>
    <p id="subtitle">Memory that follows you into every Claude Code session.</p>
    <div class="progress"><div class="bar"><b id="bar"></b></div><span id="progress-text">Checking your computer…</span></div>
  </section>

  <div class="grid">
    <nav aria-label="Setup steps"><ol class="steps" id="steps"></ol></nav>
    <main class="card" id="card" aria-live="polite"></main>
  </div>
</div>

<script>
/* ---------------------------------------------------------------------------
   Data comes from the local setup server (setup/server.mjs). The page never
   decides what is installed -- it asks, renders, and offers one action.
   The profile (setup/profile.json, served inside /api/state) decides the
   title, the order of steps and any edition-specific step, so a team edition
   is a different profile, not a different page.
   --------------------------------------------------------------------------- */
const TOKEN = new URLSearchParams(location.search).get('t') || '';
const $ = (s) => document.querySelector(s);
const el = (t, p = {}, ...kids) => { const n = Object.assign(document.createElement(t), p); n.append(...kids.filter((k) => k != null)); return n; };

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { 'content-type': 'application/json', 'x-jarvis-token': TOKEN, ...(opts.headers || {}) } });
  const text = await res.text();
  let json = null;
  try { json = text ? JSON.parse(text) : null; } catch { /* not JSON */ }
  if (!res.ok) throw new Error((json && (json.error || json.message)) || text || ('HTTP ' + res.status));
  return json;
}
const post = (p, body) => api(p, { method: 'POST', body: JSON.stringify(body || {}) });

/* The server exits when nothing holds it open; this loop is what holds it. */
let missedBeats = 0;
function beat() {
  post('/api/heartbeat').then(() => { missedBeats = 0; setLink(true); })
    .catch(() => { missedBeats++; if (missedBeats > 1) setLink(false); });
}
setInterval(beat, 3000); beat();
function setLink(on) {
  $('#link').dataset.state = on ? 'on' : 'off';
  $('#link-text').textContent = on ? 'Connected to your computer' : 'Setup closed — run /jarvis-setup again';
}

/* ---- state --------------------------------------------------------------- */
const state = { cfg: null, profile: null, preflight: [], skills: [], tools: [], telegram: null, current: null, setupResult: null };

const DEFAULT_PROFILE = {
  product: 'Jarvis OS', title: 'Set up Jarvis', subtitle: 'Memory that follows you into every Claude Code session.',
  steps: ['machine', 'memory', 'skills', 'tools', 'phone', 'finish'],
  finish: { headline: "You're set.", lines: ['Open Claude Code in any folder — it already knows you.', 'Say "done" when you finish working, so it remembers.'] },
};

async function refresh(parts = ['cfg', 'preflight', 'skills', 'tools', 'telegram']) {
  const jobs = {
    cfg: async () => { state.cfg = await api('/api/state'); state.profile = { ...DEFAULT_PROFILE, ...((state.cfg && state.cfg.profile) || {}) }; },
    preflight: async () => { state.preflight = (await api('/api/preflight')).checks || []; },
    skills: async () => { state.skills = (await api('/api/skills')).skills || []; },
    tools: async () => { state.tools = (await api('/api/tools')).tools || []; },
    telegram: async () => { state.telegram = await api('/api/telegram-status'); },
  };
  await Promise.all(parts.map((p) => jobs[p]().catch(() => {})));
  if (!state.profile) state.profile = DEFAULT_PROFILE;
}

/* ---- steps --------------------------------------------------------------- */
const STEP_DEFS = {
  machine: { title: 'Your computer', optional: false },
  memory:  { title: 'Memory', optional: false },
  skills:  { title: 'Skills', optional: false },
  tools:   { title: 'Tools', optional: false },
  workspace: { title: 'Team workspace', optional: false },
  phone:   { title: 'Phone & voice', optional: true },
  finish:  { title: 'Start using it', optional: false },
};
function stepTitle(id) {
  const p = state.profile || {};
  return (p.step_titles && p.step_titles[id]) || (STEP_DEFS[id] && STEP_DEFS[id].title) || id;
}
function stepList() { return ((state.profile && state.profile.steps) || DEFAULT_PROFILE.steps).filter((id) => STEP_DEFS[id]); }

function teamTools() { return state.tools.filter((t) => t.category === 'workspace'); }
function generalTools() { return state.tools.filter((t) => t.category !== 'workspace'); }

/* One honest status per step: ok / warn / idle, plus a short line. */
function stepStatus(id) {
  const pf = state.preflight;
  switch (id) {
    case 'machine': {
      const bad = pf.filter((c) => c.required && !c.ok).length;
      const ok = pf.filter((c) => c.ok).length;
      if (!pf.length) return { s: 'idle', line: 'Checking…' };
      return bad ? { s: 'warn', line: bad + ' thing to fix' } : { s: 'ok', line: ok + ' of ' + pf.length + ' ready' };
    }
    case 'memory': {
      const made = hubReady();
      return made ? { s: 'ok', line: shortPath(state.cfg.hub) } : { s: 'idle', line: 'Not created yet' };
    }
    case 'skills': {
      const on = state.skills.filter((s) => s.enabled).length;
      return on ? { s: 'ok', line: on + ' of ' + state.skills.length + ' on' } : { s: 'idle', line: 'None on yet' };
    }
    case 'tools': {
      const list = generalTools();
      const ready = list.filter((t) => t.state === 'ready').length;
      if (!list.length) return { s: 'idle', line: '—' };
      return { s: ready === list.length ? 'ok' : (ready ? 'warn' : 'idle'), line: ready + ' of ' + list.length + ' connected' };
    }
    case 'workspace': {
      const list = teamTools();
      const ready = list.filter((t) => t.state === 'ready').length;
      if (!list.length) return { s: 'idle', line: '—' };
      return { s: ready === list.length ? 'ok' : (ready ? 'warn' : 'idle'), line: ready + ' of ' + list.length + ' ready' };
    }
    case 'phone': {
      const tg = state.telegram && state.telegram.configured;
      const v = state.skills.find((s) => s.id === 'voice');
      const n = (tg ? 1 : 0) + (v && v.enabled ? 1 : 0);
      return n ? { s: 'ok', line: [tg && 'Telegram', v && v.enabled && 'voice'].filter(Boolean).join(' + ') } : { s: 'idle', line: 'Optional' };
    }
    case 'finish': {
      const core = stepList().filter((x) => x !== 'finish' && !STEP_DEFS[x].optional);
      const allOk = core.every((x) => stepStatus(x).s === 'ok');
      return allOk ? { s: 'ok', line: 'Ready' } : { s: 'idle', line: 'What to do next' };
    }
  }
  return { s: 'idle', line: '' };
}
function hubReady() {
  if (state.setupResult) return true;
  return Boolean(state.cfg && state.cfg.hub_exists);
}
function shortPath(p) { return String(p || '').replace(/^\/(Users|home)\/[^/]+/, '~'); }

function paintChrome() {
  const p = state.profile;
  document.title = p.title || 'Setup';
  $('#brand').textContent = p.product || 'Jarvis OS';
  $('.mark').textContent = (p.product || 'J').trim().charAt(0).toUpperCase();
  $('#title').textContent = p.title;
  $('#subtitle').textContent = p.subtitle;

  const ol = $('#steps');
  ol.replaceChildren();
  const ids = stepList();
  ids.forEach((id, i) => {
    const st = stepStatus(id);
    const b = el('button', { className: 'step', type: 'button' });
    b.dataset.state = st.s;
    if (state.current === id) b.setAttribute('aria-current', 'step');
    b.append(...[
      el('span', { className: 'num', textContent: st.s === 'ok' ? '✓' : String(i + 1) }),
      el('span', {}, el('span', { className: 't', textContent: stepTitle(id) }), el('span', { className: 's', textContent: st.line })),
      STEP_DEFS[id].optional ? el('span', { className: 'opt', textContent: 'optional' }) : null,
    ].filter(Boolean));
    b.addEventListener('click', () => go(id));
    ol.append(el('li', {}, b));
  });

  const core = ids.filter((x) => x !== 'finish' && !STEP_DEFS[x].optional);
  const done = core.filter((x) => stepStatus(x).s === 'ok').length;
  $('#bar').style.width = Math.round((done / Math.max(1, core.length)) * 100) + '%';
  $('#progress-text').textContent = done === core.length ? 'All set — everything essential is done' : done + ' of ' + core.length + ' essential steps done';
}

function go(id) {
  state.current = id;
  paintChrome();
  const card = $('#card');
  card.replaceChildren(...[].concat(VIEWS[id]()).filter(Boolean));
  card.append(navRow(id));
  const h = card.querySelector('h2'); if (h) { h.tabIndex = -1; h.focus({ preventScroll: true }); }
  if (window.innerWidth < 860) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function navRow(id) {
  const ids = stepList();
  const i = ids.indexOf(id);
  const nav = el('div', { className: 'nav' });
  const back = el('button', { className: 'btn ghost', type: 'button', textContent: '← Back' });
  back.disabled = i === 0;
  back.addEventListener('click', () => go(ids[i - 1]));
  nav.append(back);
  if (i < ids.length - 1) {
    const next = el('button', { className: 'btn', type: 'button', textContent: 'Next: ' + stepTitle(ids[i + 1]) + ' →' });
    next.addEventListener('click', () => go(ids[i + 1]));
    nav.append(next);
  }
  return nav;
}
async function rerender(parts) { await refresh(parts); go(state.current); }

/* ---- small builders ------------------------------------------------------ */
function head(title, lead) { return [el('h2', { textContent: title }), el('p', { className: 'lead', textContent: lead })]; }
function row(dotCls, name, meta, ...extra) {
  return el('div', { className: 'row' }, el('span', { className: 'dot ' + dotCls }),
    el('div', { className: 'grow' }, el('div', { className: 'name', textContent: name }), meta ? el('div', { className: 'meta', textContent: meta }) : null), ...extra.filter(Boolean));
}
function copyCmd(command) {
  const b = el('button', { className: 'btn ghost sm', type: 'button', textContent: 'Copy' });
  b.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(command); b.textContent = 'Copied'; } catch { b.textContent = 'Select it'; }
    setTimeout(() => { b.textContent = 'Copy'; }, 1500);
  });
  return el('div', { className: 'cmd' }, el('code', { textContent: command }), b);
}
function busy(btn, label) {
  const old = btn.textContent;
  btn.disabled = true;
  btn.replaceChildren(el('span', { className: 'spin' }), document.createTextNode(label));
  return () => { btn.disabled = false; btn.textContent = old; };
}
function sw(checked, disabled, onChange, label) {
  const input = el('input', { type: 'checkbox', checked: !!checked, disabled: !!disabled });
  if (label) input.setAttribute('aria-label', label);
  input.addEventListener('change', () => onChange(input));
  return el('label', { className: 'switch' }, input, el('span'));
}
function secretField(name, label, help) {
  const input = el('input', { type: 'password', placeholder: 'Paste it here', autocomplete: 'off' });
  const b = el('button', { className: 'btn sm', type: 'button', textContent: 'Save' });
  const msg = el('div', { className: 'msg' });
  b.addEventListener('click', async () => {
    const value = input.value.trim(); if (!value) return;
    const done = busy(b, 'Saving');
    try { await post('/api/secret', { name, value }); input.value = ''; msg.className = 'msg ok'; msg.textContent = 'Saved on this computer.'; }
    catch (e) { msg.className = 'msg bad'; msg.textContent = e.message; }
    done();
  });
  return el('div', { className: 'field' }, el('label', { textContent: label || name }), el('div', { className: 'inline' }, input, b), help ? el('div', { className: 'note', textContent: help }) : null, msg);
}

const FRIENDLY = {
  node: 'Node.js — what Claude Code runs on', claude: 'Claude Code', git: 'git — keeps a history of your memory (optional)',
  'git-identity': 'A name for saved changes (optional)', bun: 'Bun — only for the Telegram bridge', tmux: 'tmux — only for always-on mode',
  ffmpeg: 'ffmpeg — only for voice', obsidian: 'Obsidian — read your memory as notes',
};
const INSTALLABLE = ['bun', 'tmux', 'ffmpeg', 'obsidian'];

/* ---- views --------------------------------------------------------------- */
const VIEWS = {
  machine() {
    const pf = state.preflight;
    const bad = pf.filter((c) => c.required && !c.ok);
    const opt = pf.filter((c) => !c.required && !c.ok);
    const out = head('Your computer', 'What Claude Code needs to run this, and anything missing. Required items come first.');
    out.push(bad.length
      ? el('div', { className: 'callout warn' }, el('b', { textContent: bad.length + ' required item needs attention. ' }), document.createTextNode('Fix it below, then press Check again.'))
      : el('div', { className: 'callout' }, el('b', { textContent: 'Everything required is here. ' }), document.createTextNode(opt.length ? opt.length + ' optional extra(s) are missing — fine to skip.' : 'Nothing missing.')));
    const list = el('div', { className: 'list', style: 'margin-top:16px' });
    bad.concat(opt, pf.filter((c) => c.ok)).forEach((c) => {
      const dot = c.ok ? 'ok' : (c.required ? 'bad' : 'warn');
      const extra = [];
      if (!c.ok && INSTALLABLE.includes(c.id)) extra.push(installLegacy(c.id));
      else extra.push(el('span', { className: 'chip ' + dot, textContent: c.ok ? 'Ready' : (c.required ? 'Required' : 'Optional') }));
      list.append(row(dot, FRIENDLY[c.id] || c.label, c.detail || '', ...extra));
      if (!c.ok && c.fix && !INSTALLABLE.includes(c.id)) list.append(copyCmd(c.fix));
    });
    out.push(list);
    const again = el('button', { className: 'btn ghost sm', type: 'button', textContent: 'Check again', style: 'margin-top:14px' });
    again.addEventListener('click', async () => {
      const done = busy(again, 'Checking');
      try { state.preflight = (await api('/api/preflight?refresh=1')).checks || []; } catch {}
      done(); go('machine');
    });
    out.push(again);
    return out;
  },

  memory() {
    const out = head('Memory', 'One folder of plain text files that Claude reads at the start of every session — in any project. This is your second brain.');
    const hubIn = el('input', { type: 'text', value: shortPath((state.cfg && state.cfg.hub) || '~/jarvis-hub'), id: 'hub-path' });
    out.push(el('div', { className: 'field' }, el('label', { htmlFor: 'hub-path', textContent: 'Where to keep it' }), hubIn,
      el('div', { className: 'note', textContent: 'The default is fine. You can open this folder in Obsidian later.' })));

    const go1 = el('button', { className: 'btn big', type: 'button', textContent: hubReady() ? 'Run setup again' : 'Create my memory' });
    const result = el('div', { className: 'list', style: 'margin-top:16px' });
    go1.addEventListener('click', async () => {
      const done = busy(go1, 'Setting up');
      try {
        const r = await post('/api/setup-all', { hub: hubIn.value.trim() });
        state.setupResult = r;
        await refresh();
        go('memory');
        return;
      } catch (e) { result.replaceChildren(row('bad', 'That didn’t work', e.message)); }
      done();
    });
    out.push(el('div', { className: 'inline', style: 'flex-wrap:wrap' }, go1,
      el('span', { className: 'note', style: 'margin:0', textContent: 'Creates the folder, turns on history and the basic skills, and connects the free tools. Safe to run twice.' })));

    if (state.setupResult && state.setupResult.steps) {
      state.setupResult.steps.forEach((st) => {
        result.append(row(st.ok ? 'ok' : 'warn', st.label, st.ok ? (st.detail && st.detail.skipped ? 'Skipped: ' + st.detail.reason : 'Done') : (st.error || 'Needs a look')));
      });
    }
    out.push(result);

    const obs = state.preflight.find((c) => c.id === 'obsidian');
    out.push(el('div', { className: 'section-label', textContent: 'Optional — see it in Obsidian' }));
    if (obs && obs.ok) {
      const vIn = el('input', { type: 'text', placeholder: 'Path to your Obsidian vault, e.g. ~/Documents/Notes', value: shortPath((state.cfg && state.cfg.obsidian_vault) || '') });
      const b = el('button', { className: 'btn ghost sm', type: 'button', textContent: 'Link' });
      const msg = el('div', { className: 'msg' });
      b.addEventListener('click', async () => {
        const done = busy(b, 'Linking');
        try {
          const r = await post('/api/config', { obsidian_vault: vIn.value.trim() });
          state.cfg = { ...state.cfg, ...(r.config || {}) };
          const ok = r.vault_link && r.vault_link.linked;
          msg.className = 'msg ' + (ok ? 'ok' : 'bad');
          msg.textContent = ok ? 'Linked — a “Jarvis” folder now shows inside your vault.' : 'Couldn’t link that folder.';
        } catch (e) { msg.className = 'msg bad'; msg.textContent = e.message; }
        done();
      });
      out.push(el('div', { className: 'inline' }, vIn, b), msg);
    } else {
      out.push(row('', 'Obsidian isn’t installed', 'Optional. Install it from the Tools step if you want to browse your memory as notes.'));
    }
    return out;
  },

  skills() {
    const out = head('Skills', 'Abilities Claude picks up on its own when they fit the task. The defaults are a good start — turn on more any time.');
    const eli = state.cfg && state.cfg.auto_eli5;
    out.push(row('', 'Explain with pictures', 'Long explanations become a simple visual page instead of a wall of text.',
      sw(eli, false, async (i) => {
        try { const r = await post('/api/config', { auto_eli5: i.checked }); state.cfg = { ...state.cfg, ...(r.config || {}) }; }
        catch (e) { i.checked = !i.checked; }
      }, 'Explain with pictures')));

    const groups = {};
    state.skills.forEach((s) => { (groups[s.category || 'other'] ||= []).push(s); });
    const NAMES = { core: 'Everyday', research: 'Research', media: 'Media', dev: 'Building', obsidian: 'Obsidian', team: 'Team' };
    Object.entries(groups).forEach(([cat, list]) => {
      out.push(el('div', { className: 'section-label', textContent: NAMES[cat] || cat }));
      const box = el('div', { className: 'list' });
      list.forEach((s) => {
        const blocked = s.precondition_met === false;
        const msg = el('div', { className: 'msg bad' });
        const toggle = sw(s.enabled, blocked, async (i) => {
          i.disabled = true;
          try { const r = await post('/api/skills', { id: s.id, enabled: i.checked }); s.enabled = r.enabled; msg.textContent = ''; }
          catch (e) { i.checked = !i.checked; msg.textContent = e.message; }
          i.disabled = blocked; paintChrome();
          if ((s.requires || []).length) go('skills');
        }, s.name);
        const meta = blocked ? ('Needs ' + (s.requires_tool || 'something not installed') + ' first') : s.description;
        const r = row(s.enabled ? 'ok' : '', s.name, meta, s.url ? el('a', { href: s.url, target: '_blank', rel: 'noopener', textContent: 'About', className: 'note', style: 'margin:0' }) : null, toggle);
        r.querySelector('.grow').append(msg);
        if (s.details) r.title = s.details;
        box.append(r);
        if (s.enabled) (s.requires || []).forEach((k) => box.append(secretField(k, k + ' — needed by ' + s.name)));
      });
      out.push(box);
    });
    return out;
  },

  tools() {
    const list = generalTools();
    const out = head('Tools', 'Programs and connections Claude can use for you. Press Install or Connect — each one says what it’s for. Skip any you don’t need.');
    if (!list.length) { out.push(row('warn', 'Couldn’t read the tool list', 'Restart setup with /jarvis-setup.')); return out; }
    const ready = list.filter((t) => t.state === 'ready').length;
    out.push(el('div', { className: 'callout' }, el('b', { textContent: ready + ' of ' + list.length + ' ready. ' }), document.createTextNode('Recommended ones are marked — the rest are for when you need them.')));
    out.push(toolGrid(list));
    return out;
  },

  workspace() {
    const p = state.profile.workspace || {};
    const list = teamTools();
    const out = head(p.title || 'Team workspace', p.lead || 'Connect to the shared team knowledge and code.');
    if (p.intro) out.push(el('div', { className: 'callout' }, ...p.intro.map((line, i) => el('div', { style: i ? 'margin-top:6px' : '', textContent: line }))));
    out.push(el('div', { style: 'height:16px' }));
    out.push(toolGrid(list));
    if (p.first_prompt) {
      out.push(el('div', { className: 'section-label', textContent: 'Your first message to Claude' }));
      out.push(el('p', { className: 'note', style: 'margin:0 0 8px', textContent: 'Open Claude Code and paste this. It reads the team briefing and tells you where things stand.' }));
      out.push(copyCmd(p.first_prompt));
    }
    return out;
  },

  phone() {
    const out = head('Phone & voice', 'Optional. Message Claude from Telegram when you’re away from your desk, and talk to it instead of typing.');
    const tg = state.telegram || {};
    out.push(el('div', { className: 'section-label', textContent: 'Telegram' }));
    const steps = el('div', { className: 'list' });
    steps.append(row('', '1 · Make a bot', 'In Telegram, message BotFather and send /newbot.', el('a', { className: 'btn ghost sm', href: 'https://t.me/BotFather', target: '_blank', rel: 'noopener', textContent: 'Open BotFather' })));
    const tok = el('input', { type: 'password', placeholder: '123456789:AA…', autocomplete: 'off' });
    const save = el('button', { className: 'btn sm', type: 'button', textContent: 'Save' });
    const tmsg = el('div', { className: 'msg' });
    save.addEventListener('click', async () => {
      const done = busy(save, 'Saving');
      try { await post('/api/telegram-token', { value: tok.value.trim() }); tok.value = ''; tmsg.className = 'msg ok'; tmsg.textContent = 'Saved.'; }
      catch (e) { tmsg.className = 'msg bad'; tmsg.textContent = e.message; }
      done();
    });
    const r2 = row(tg.configured ? 'ok' : '', '2 · Paste the token it gives you', null);
    r2.querySelector('.grow').append(el('div', { className: 'inline', style: 'margin-top:8px' }, tok, save), tmsg);
    steps.append(r2);
    const conn = el('button', { className: 'btn sm', type: 'button', textContent: 'Connect' });
    conn.addEventListener('click', async () => {
      const done = busy(conn, 'Connecting');
      try { const r = await post('/api/telegram-install'); done(); conn.textContent = r.ok ? 'Connected' : 'Didn’t work'; } catch (e) { done(); conn.textContent = e.message; }
    });
    steps.append(row('', '3 · Connect it', 'Runs on this computer.', conn));
    const chk = el('button', { className: 'btn ghost sm', type: 'button', textContent: 'Check' });
    const pair = el('div');
    chk.addEventListener('click', async () => {
      try {
        state.telegram = await api('/api/telegram-status');
        pair.replaceChildren();
        if (state.telegram.pending && state.telegram.pending.length) {
          pair.append(el('div', { className: 'note', textContent: 'Last step — paste this into Claude Code:' }));
          state.telegram.pending.forEach((pp) => pair.append(copyCmd('/telegram:access pair ' + pp.code)));
        } else pair.append(el('div', { className: 'note', textContent: state.telegram.configured ? 'Connected.' : 'Nothing yet — send your bot a message first.' }));
      } catch (e) { pair.replaceChildren(el('div', { className: 'msg bad', textContent: e.message })); }
      paintChrome();
    });
    steps.append(row(tg.configured ? 'ok' : '', '4 · Say hello to your bot', 'Send it any message, then press Check.', chk));
    steps.append(pair);
    out.push(steps);
    out.push(el('details', {}, el('summary', { textContent: 'One thing worth knowing' }),
      el('p', { className: 'note', textContent: 'Telegram lets only one program listen to a bot. Run this on one computer only — a second one silently swallows messages.' })));

    out.push(el('div', { className: 'section-label', textContent: 'Voice' }));
    const voice = state.skills.find((s) => s.id === 'voice');
    if (voice) {
      out.push(row(voice.enabled ? 'ok' : '', 'Talk to it, hear it answer', 'Speech recognition runs on your own computer. Needs ffmpeg.',
        sw(voice.enabled, voice.precondition_met === false, async (i) => {
          try { const r = await post('/api/skills', { id: 'voice', enabled: i.checked }); voice.enabled = r.enabled; } catch { i.checked = !i.checked; }
          go('phone');
        }, 'Voice')));
      if (voice.enabled) out.push(secretField('ELEVENLABS_API_KEY', 'Nicer voices (ElevenLabs key) — optional'));
    }
    return out;
  },

  finish() {
    const p = state.profile.finish || DEFAULT_PROFILE.finish;
    const out = head(p.headline || "You're set.", 'Close this tab whenever you like. Everything below is how you use it from now on.');
    const missing = stepList().filter((x) => x !== 'finish' && !STEP_DEFS[x].optional && stepStatus(x).s !== 'ok');
    if (missing.length) {
      out.push(el('div', { className: 'callout warn', style: 'margin-bottom:18px' }, el('b', { textContent: 'Still open: ' }),
        ...missing.map((m, i) => { const a = el('a', { href: '#', textContent: stepTitle(m) }); a.addEventListener('click', (e) => { e.preventDefault(); go(m); }); return [i ? document.createTextNode(', ') : null, a]; }).flat().filter(Boolean)));
    }
    const ul = el('ul', { className: 'done-list' });
    (p.lines || []).forEach((line, i) => ul.append(el('li', {}, el('span', { className: 'k', textContent: String(i + 1) }), el('div', { textContent: line }))));
    out.push(ul);
    out.push(el('div', { className: 'section-label', textContent: 'Handy commands' }));
    (p.commands || ['/jarvis-setup', '/done']).forEach((c) => out.push(el('div', { style: 'margin-bottom:8px' }, copyCmd(c))));
    return out;
  },
};

/* ---- tools grid ---------------------------------------------------------- */
const KIND = { cli: 'program', app: 'app', mcp: 'connection', repo: 'code' };
function toolGrid(list) {
  const grid = el('div', { className: 'tools' });
  list.forEach((t) => grid.append(toolCard(t)));
  return grid;
}
function toolCard(t) {
  const ready = t.state === 'ready';
  const chip = ready ? el('span', { className: 'chip ok', textContent: t.kind === 'mcp' ? 'Connected' : (t.kind === 'repo' ? 'Downloaded' : 'Installed') })
    : el('span', { className: 'chip' + (t.default ? ' warn' : ''), textContent: t.default ? 'Recommended' : 'Optional' });
  const card = el('div', { className: 'tool' });
  card.dataset.state = t.state;
  card.append(el('header', {}, el('span', { className: 'name', textContent: t.name }), chip));
  card.append(el('div', { className: 'why', textContent: t.why }));
  const actions = el('div', { className: 'actions' });
  const msg = el('div', { className: 'msg' });

  let secretIn = null;
  if (!ready && t.secret) {
    secretIn = el('input', { type: 'password', placeholder: t.secret.placeholder || 'Paste it here', autocomplete: 'off' });
    secretIn.setAttribute('aria-label', t.secret.label || 'Secret');
    card.append(el('div', { className: 'field', style: 'margin:0' }, el('label', { textContent: t.secret.label }), secretIn, t.secret.help ? el('div', { className: 'note', style: 'margin:0', textContent: t.secret.help }) : null));
  }

  if (!ready) {
    const isMcp = t.kind === 'mcp';
    const can = isMcp ? t.can_connect !== false : t.can_install !== false;
    if (can) {
      const b = el('button', { className: 'btn sm', type: 'button', textContent: isMcp ? 'Connect' : (t.kind === 'repo' ? 'Download' : 'Install') });
      b.addEventListener('click', async () => {
        if (secretIn && !secretIn.value.trim()) { msg.className = 'msg bad'; msg.textContent = 'Paste ' + (t.secret.label || 'the key') + ' first.'; secretIn.focus(); return; }
        const done = busy(b, isMcp ? 'Connecting' : 'Working');
        try {
          const r = await post(isMcp ? '/api/tools/connect' : '/api/tools/install', { id: t.id, secret: secretIn ? secretIn.value.trim() : undefined });
          if (r && r.ok) { await rerender(['tools', 'preflight']); return; }
          msg.className = 'msg bad'; msg.textContent = (r && (r.error || r.detail)) || 'Didn’t work';
          if (r && r.manual) card.append(copyCmd(r.manual));
        } catch (e) { msg.className = 'msg bad'; msg.textContent = e.message; }
        done();
      });
      actions.append(b);
    }
    if (t.manual && !can) card.append(copyCmd(t.manual));
  } else if (t.after) {
    card.append(el('div', { className: 'after', textContent: t.after }));
  }
  if (t.docs) actions.append(el('a', { href: t.docs, target: '_blank', rel: 'noopener', className: 'note', style: 'margin:0', textContent: 'What is this?' }));
  actions.append(el('span', { className: 'kind', style: 'margin-left:auto', textContent: KIND[t.kind] || t.kind }));
  card.append(actions, msg);
  return card;
}
function installLegacy(tool) {
  const b = el('button', { className: 'btn sm', type: 'button', textContent: 'Install' });
  b.addEventListener('click', async () => {
    const done = busy(b, 'Installing');
    try {
      const r = await post('/api/install-tool', { tool });
      if (r.ok) { state.preflight = (await api('/api/preflight?refresh=1')).checks || []; go(state.current); return; }
      if (r.error === 'no-installer') { b.replaceWith(copyCmd(r.manual || ('see ' + (r.url || '')))); return; }
      done(); b.textContent = 'Didn’t work';
    } catch (e) { done(); b.textContent = e.message; }
  });
  return b;
}

/* ---- background: the ChatGP knowledge-graph field ------------------------
   Ported from ChatGP's GraphBackground: node count min(210, area/8000),
   speed +-0.25 px/frame, link distance 210, node radius 1-2.6. One static
   frame under prefers-reduced-motion; DPR capped at 2. */
(function graph() {
  const cv = $('#graph');
  const c2d = cv.getContext('2d');
  if (!c2d) return;
  const LINK = 210, MAX_DPR = 2;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w = 0, h = 0, nodes = [], raf = 0;
  const spawn = () => ({ x: Math.random() * w, y: Math.random() * h, vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5, r: 1 + Math.random() * 1.6 });
  function draw() {
    c2d.clearRect(0, 0, w, h);
    for (let i = 0; i < nodes.length; i++) {
      const a = nodes[i];
      if (!reduced) {
        a.x += a.vx; a.y += a.vy;
        if (a.x < 0 || a.x > w) a.vx *= -1;
        if (a.y < 0 || a.y > h) a.vy *= -1;
      }
      for (let j = i + 1; j < nodes.length; j++) {
        const b = nodes[j];
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        if (d < LINK) {
          c2d.strokeStyle = 'rgba(125,211,252,' + ((1 - d / LINK) * 0.22).toFixed(3) + ')';
          c2d.lineWidth = 0.6;
          c2d.beginPath(); c2d.moveTo(a.x, a.y); c2d.lineTo(b.x, b.y); c2d.stroke();
        }
      }
    }
    c2d.fillStyle = 'rgba(125,211,252,0.5)';
    for (const n of nodes) { c2d.beginPath(); c2d.arc(n.x, n.y, n.r, 0, Math.PI * 2); c2d.fill(); }
    if (!reduced) raf = requestAnimationFrame(draw);
  }
  function resize() {
    const nw = cv.clientWidth, nh = cv.clientHeight;
    if (!nw || !nh) return;
    const dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
    cv.width = Math.round(nw * dpr); cv.height = Math.round(nh * dpr);
    c2d.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (w > 0 && h > 0) for (const n of nodes) { n.x = (n.x / w) * nw; n.y = (n.y / h) * nh; }
    w = nw; h = nh;
    const count = Math.round(Math.min(210, (w * h) / 8000));
    if (nodes.length > count) nodes.length = count;
    while (nodes.length < count) nodes.push(spawn());
    if (reduced) draw();
  }
  resize();
  window.addEventListener('resize', resize);
  if (reduced) draw(); else raf = requestAnimationFrame(draw);
  document.addEventListener('visibilitychange', () => {
    if (reduced) return;
    if (document.hidden) cancelAnimationFrame(raf); else raf = requestAnimationFrame(draw);
  });
})();

/* ---- boot ---------------------------------------------------------------- */
(async () => {
  await refresh();
  /* Open the first step that still needs something, so the page always
     points at the next useful thing to do. */
  const ids = stepList();
  const first = ids.find((id) => id !== 'finish' && !STEP_DEFS[id].optional && stepStatus(id).s !== 'ok') || 'finish';
  go(first);
})();
